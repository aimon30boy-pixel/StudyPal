<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="StudyPal: ask about any subject, build a study kit for anything, plus lessons, quizzes and notes for Algebra 1, Geometry, Algebra 2, Biology, AP Human Geography and English 1.">
<meta name="theme-color" content="#fbf8f3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 6h20a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z' fill='%233a2bb5'/%3E%3C/svg%3E">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
body { font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>StudyPal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500..800&family=Figtree:wght@400..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: airy single column; home is a big prompt beside three floating cards on a soft color blob. Quiet top bar, phone gets a bottom bar. */
:root {
  --bg: #fbf8f3;
  --surface: #ffffff;
  --surface-2: #f4f0e9;
  --ink: #1c1b2e;
  --ink-2: #3f3d52;
  --muted: #74717f;
  --line: #ece6dc;
  --line-strong: #dcd4c7;
  --c1: #2563eb;
  --c2: #f2621f;
  --c3: #7c3aed;
  --a-alg1: #2563eb;
  --a-geo: #0d8a66;
  --a-alg2: #7c3aed;
  --a-bio: #d6336c;
  --a-hug: #b45309;
  --a-eng1: #0e7490;
  --hero: #3a2bb5;
  --hero-shadow: rgba(30, 20, 110, .22);
  --hero-glow: rgba(99, 80, 255, .38);
  --accent: var(--a-geo);
  --accent-ink: #ffffff;
  --good: #0d7a4e;
  --bad: #b42318;
  --warn: #9a5b00;
  --shadow: 0 2px 4px rgba(40, 30, 20, .04), 0 12px 32px rgba(40, 30, 20, .07);
  --f-display: "Lexend", ui-rounded, ui-sans-serif, system-ui, sans-serif;
  --f-body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 20px;
  --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121119; --surface: #1b1a25; --surface-2: #24222f; --ink: #f1eff6; --ink-2: #cbc8d6; --muted: #918da0;
    --line: #2d2b3a; --line-strong: #3d3a4c; --c1: #7aa2ff; --c2: #ff8a52; --c3: #b18cff; --a-alg1: #7aa2ff; --a-geo: #4fd4a5; --a-alg2: #b18cff; --a-bio: #ff7aa6; --a-hug: #f5b04c; --a-eng1: #4fd1e6; --hero: #c7c0ff; --hero-shadow: rgba(0, 0, 0, .5); --hero-glow: rgba(150, 130, 255, .65);
    --accent-ink: #121119; --good: #4bd39c; --bad: #ff7b6f; --warn: #f2b14c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121119; --surface: #1b1a25; --surface-2: #24222f; --ink: #f1eff6; --ink-2: #cbc8d6; --muted: #918da0;
  --line: #2d2b3a; --line-strong: #3d3a4c; --c1: #7aa2ff; --c2: #ff8a52; --c3: #b18cff; --a-alg1: #7aa2ff; --a-geo: #4fd4a5; --a-alg2: #b18cff; --a-bio: #ff7aa6; --a-hug: #f5b04c; --a-eng1: #4fd1e6; --hero: #c7c0ff; --hero-shadow: rgba(0, 0, 0, .5); --hero-glow: rgba(150, 130, 255, .65);
  --accent-ink: #121119; --good: #4bd39c; --bad: #ff7b6f; --warn: #f2b14c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
}
body[data-subject="alg1"] { --accent: var(--a-alg1); }
body[data-subject="geo"]  { --accent: var(--a-geo); }
body[data-subject="alg2"] { --accent: var(--a-alg2); }
body[data-subject="bio"]  { --accent: var(--a-bio); }
body[data-subject="hug"]  { --accent: var(--a-hug); }
body[data-subject="eng1"] { --accent: var(--a-eng1); }
body {
  --accent-soft: color-mix(in srgb, var(--accent) 11%, var(--surface));
  --accent-line: color-mix(in srgb, var(--accent) 35%, var(--line));
  --grid: color-mix(in srgb, var(--accent) 13%, transparent);
  --good-soft: color-mix(in srgb, var(--good) 12%, var(--surface));
  --bad-soft: color-mix(in srgb, var(--bad) 11%, var(--surface));
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 650; letter-spacing: -0.015em; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.muted { color: var(--muted); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; gap: 20px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.switch { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.switch button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 550; color: var(--muted); cursor: pointer; white-space: nowrap; }
.switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.switch button[data-subject="alg1"][aria-pressed="true"] { color: var(--a-alg1); }
.switch button[data-subject="geo"][aria-pressed="true"] { color: var(--a-geo); }
.switch button[data-subject="alg2"][aria-pressed="true"] { color: var(--a-alg2); }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; border-radius: 7px; font-weight: 550; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.tabs button:hover { background: var(--surface-2); }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

.bottombar { display: none; }

main { max-width: 1140px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view[hidden] { display: none !important; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: var(--r-sm); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; transition: filter .12s, transform .06s; }
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.link { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 4px; }
.btn.danger { background: var(--surface); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 9px 11px; min-width: 0; }
textarea.input { resize: vertical; min-height: 120px; line-height: 1.5; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .03em; padding: 3px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); white-space: nowrap; }
.chip.plain { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 14px; }

/* Rich text (lessons and AI answers) */
.rich { color: var(--ink-2); max-width: 68ch; }
.rich > * + * { margin-top: .8em; }
.rich h3, .rich h4, .rich h5, .rich h6 { color: var(--ink); font-size: 17px; margin-top: 1.4em; }
.rich strong { color: var(--ink); font-weight: 650; }
.rich ul, .rich ol { padding-left: 1.3em; margin-block: .6em 0; }
.rich li + li { margin-top: .3em; }
.rich code { font-family: var(--f-mono); font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.rich .table-wrap { overflow-x: auto; }
.rich table { border-collapse: collapse; width: 100%; min-width: 360px; font-size: 14px; }
.rich th, .rich td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.rich th { font-weight: 600; color: var(--ink); font-size: 13px; }
mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
mjx-container[display="true"] { margin: .9em 0 !important; padding-block: 2px; }

/* Subject header */
.hero { position: relative; border: 1px solid var(--line); border-radius: var(--r); background-color: var(--surface); padding: 28px 28px 24px; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(100deg, transparent 35%, #000 85%); -webkit-mask-image: linear-gradient(100deg, transparent 35%, #000 85%); pointer-events: none; }
.hero > * { position: relative; }
.hero-top { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
.hero h1 { font-size: clamp(30px, 5vw, 44px); }
.hero p.lede { color: var(--ink-2); max-width: 58ch; margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); gap: 28px; }
.stat b { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 20px; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.save-note { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex: none; }
.dot.on { background: var(--good); }

/* Unit grid */
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 32px 0 14px; flex-wrap: wrap; }
.section-head h2 { font-size: 20px; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.unit { text-align: left; cursor: pointer; padding: 16px 18px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; transition: border-color .12s, box-shadow .12s, transform .12s; }
.unit:hover { border-color: var(--accent-line); box-shadow: var(--shadow); transform: translateY(-1px); }
.unit .u-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.unit h3 { font-size: 17px; }
.unit p { color: var(--muted); font-size: 14px; }
.unit .u-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
.status-done { color: var(--good); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.status-done svg { width: 14px; height: 14px; }

/* Lesson */
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 0; font-weight: 550; font-size: 14px; }
.back:hover { color: var(--accent); }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; margin-top: 14px; align-items: start; }
.lesson-head h1 { font-size: clamp(28px, 4.4vw, 40px); margin-top: 10px; }
.lesson-head p { color: var(--muted); margin-top: 8px; font-size: 16px; }
.lesson-body { margin-top: 26px; }
.example { margin-top: 32px; padding: 20px 22px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.example .mono { color: var(--accent); }
.example .problem { margin-top: 8px; color: var(--ink); font-weight: 500; }
.steps { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: baseline; color: var(--ink-2); }
.steps li::before { content: counter(step); font-family: var(--f-mono); font-size: 12px; color: var(--accent); border: 1px solid var(--accent-line); border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; }
.answer-line { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 600; color: var(--ink); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 12px; }
.side .card { padding: 16px 18px; }
.side h3 { font-size: 15px; margin-bottom: 10px; }
.keys { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 14px; color: var(--ink-2); }
.keys li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
.keys li::before { content: ""; width: 6px; height: 6px; background: var(--accent); margin-top: 8px; transform: rotate(45deg); }
.side .btn { width: 100%; }
.pager { display: flex; justify-content: space-between; gap: 10px; }
.pager button { flex: 1; min-width: 0; text-align: left; }
.pager button span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* AI panel */
.ai-panel { margin-top: 32px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 20px 22px; }
.ai-panel h2 { font-size: 18px; }
.ai-panel .row { margin-top: 12px; }
.ai-ask { display: flex; gap: 8px; margin-top: 12px; }
.ai-ask .input { flex: 1; }
.ai-out { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.thinking { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.thinking::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.notice { font-size: 13.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; }
.notice.warn { color: var(--warn); }
.error-text { color: var(--bad); font-size: 13.5px; }

/* Practice */
.practice { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.panel { padding: 22px; }
.panel h2 { font-size: 22px; }
.panel > p { color: var(--muted); margin-top: 6px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.form-grid .full { grid-column: 1 / -1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; width: 100%; }
.seg button { flex: 1; border: 0; background: var(--surface); padding: 9px 10px; cursor: pointer; font-weight: 550; font-size: 14px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.history { padding: 18px; }
.history h3 { font-size: 15px; margin-bottom: 12px; }
.history ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.history li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.history li:last-child { border-bottom: 0; }
.history li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history .score { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); }

.quiz { max-width: 760px; }
.quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.quiz-head .title { font-weight: 600; }
.bar { height: 4px; background: var(--surface-2); border-radius: 99px; margin: 12px 0 18px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.qcard { padding: 24px; }
.qtext { font-size: 17px; color: var(--ink); max-width: none; }
.choices { display: grid; gap: 8px; margin-top: 18px; }
.choice { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); padding: 11px 12px; cursor: pointer; transition: border-color .1s, background .1s; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .letter { font-family: var(--f-mono); font-size: 12px; width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; border: 1px solid var(--line-strong); color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[aria-pressed="true"] .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.right .letter { background: var(--good); border-color: var(--good); color: var(--surface); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.choice:disabled { cursor: default; }
.choice .ctext p { margin: 0; }
.num-answer { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.num-answer .input { flex: 1 1 220px; font-family: var(--f-mono); font-size: 16px; }
.num-help { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.feedback { margin-top: 16px; padding: 14px 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); }
.feedback.good { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); background: var(--good-soft); }
.feedback.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: var(--bad-soft); }
.feedback.hint { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.feedback .verdict { font-weight: 650; margin-bottom: 4px; }
.feedback.good .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--bad); }
.feedback.hint .verdict { color: var(--warn); }
.quiz-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.result-score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.result-score b { font-family: var(--f-display); font-size: 56px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.review { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 8px; }
.review li { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface); }
.review summary { cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; list-style: none; }
.review summary::-webkit-details-marker { display: none; }
.review .mark { font-weight: 700; }
.review .mark.ok { color: var(--good); }
.review .mark.no { color: var(--bad); }
.review .rich { margin-top: 8px; padding-left: 30px; font-size: 14px; }

/* Formulas */
.formula-tools { display: flex; gap: 12px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.formula-tools .input { max-width: 380px; }
.fsec { margin-top: 26px; }

.ftable { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }

/* Tutor */
.tutor { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: calc(100vh - 150px); min-height: 480px; max-width: 860px; margin: 0 auto; }
.tutor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); }

.chat { overflow-y: auto; padding: 18px 2px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 92%; }
.msg.user { align-self: flex-end; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--ink); padding: 10px 14px; border-radius: 12px 12px 4px 12px; white-space: pre-wrap; }

.starter { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px; margin-top: 16px; }
.starter button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer; color: var(--ink-2); font-size: 14px; }

/* Study */

.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 26px 18px; text-align: center; background: var(--surface-2); cursor: pointer; transition: border-color .12s, background .12s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop b { display: block; color: var(--ink); font-weight: 600; }
.drop span { font-size: 13px; color: var(--muted); }
.files { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.files li { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.files li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.result { margin-top: 22px; padding: 22px; }
.result h2 { font-size: 22px; margin-top: 6px; }
.result .src { font-size: 13px; color: var(--muted); margin-top: 4px; word-break: break-all; }
.result h3 { font-size: 15px; margin: 20px 0 8px; }
.saved { padding: 18px; }
.saved h3 { font-size: 15px; margin-bottom: 10px; }
.saved ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.saved li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.saved li button.open { text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 9px 11px; border-radius: var(--r-sm); cursor: pointer; min-width: 0; }
.saved li button.open:hover { border-color: var(--accent); }
.saved li button.open b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved li button.open span { font-size: 12px; color: var(--muted); }

/* Phone */
@media (max-width: 820px) {
  .tabs { display: none; }
  .topbar-inner { flex-wrap: wrap; gap: 10px; }
  .switch { order: 3; width: 100%; }
  .switch button { flex: 1; padding: 7px 6px; }
  .bottombar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
  .bottombar button { border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 8px 2px 9px; font-size: 11px; font-weight: 550; color: var(--muted); cursor: pointer; }
  .bottombar svg { width: 21px; height: 21px; }
  .bottombar button[aria-current="page"] { color: var(--accent); }
  main { padding-block: 18px calc(84px + env(safe-area-inset-bottom, 0px)); }
  .lesson, .practice, .study { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .side { position: static; }
  .hero { padding: 22px 18px 20px; }
  .stats { gap: 18px; }
  .stat b { font-size: 22px; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .frow { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 12px 14px; }
  .tutor { height: calc(100vh - 210px - env(safe-area-inset-bottom, 0px)); min-height: 420px; }
  .qcard, .panel, .result { padding: 18px; }
  .example, .ai-panel { padding: 18px; }
}

/* ===== Airy redesign ===== */
body { font-size: 16px; }

.topbar-inner { padding-block: 14px; max-width: 1180px; }
.brand { font-size: 21px; font-weight: 800; }

.subject-pill::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
main { max-width: 1180px; padding-block: 36px 80px; }
.btn { font-family: var(--f-display); font-weight: 600; border-radius: 12px; padding: 11px 20px; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 65%, #000); border-width: 0; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 65%, #000); }

.input, select.input, textarea.input { border-radius: 12px; border: 1.5px solid var(--line-strong); padding: 11px 14px; }

/* Home */

.icon-btn svg { width: 21px; height: 21px; }

.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; max-width: 620px; }
.quick button { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 15px; font-size: 14px; color: var(--ink-2); cursor: pointer; transition: border-color .12s, background .12s; }
.quick button:hover { border-color: var(--accent); background: var(--surface); color: var(--ink); }
.picker { display: flex; align-items: center; gap: 10px; margin-top: 34px; flex-wrap: wrap; }
.picker > span { font-size: 14px; color: var(--muted); }
.picker button { font-family: var(--f-display); font-weight: 600; font-size: 14.5px; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 8px 16px; cursor: pointer; color: var(--ink-2); box-shadow: 0 2px 0 var(--line-strong); }
.picker button[data-s="alg1"][aria-pressed="true"] { background: var(--a-alg1); border-color: var(--a-alg1); color: var(--surface); box-shadow: 0 2px 0 color-mix(in srgb, var(--a-alg1) 60%, #000); }
.picker button[data-s="geo"][aria-pressed="true"] { background: var(--a-geo); border-color: var(--a-geo); color: var(--surface); box-shadow: 0 2px 0 color-mix(in srgb, var(--a-geo) 60%, #000); }
.picker button[data-s="alg2"][aria-pressed="true"] { background: var(--a-alg2); border-color: var(--a-alg2); color: var(--surface); box-shadow: 0 2px 0 color-mix(in srgb, var(--a-alg2) 60%, #000); }
.stage { position: relative; height: 470px; }
.blob { position: absolute; inset: 40px 30px 20px 50px; border-radius: 50%; filter: blur(46px); opacity: .55;
  background: radial-gradient(circle at 25% 30%, var(--c1) 0, transparent 55%), radial-gradient(circle at 78% 55%, var(--c2) 0, transparent 52%), radial-gradient(circle at 45% 85%, var(--c3) 0, transparent 55%);
  animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(10px, -14px) scale(1.04) rotate(8deg); } }
.float { position: absolute; width: 230px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px 22px 22px; box-shadow: 0 2px 6px rgba(40,30,20,.05), 0 22px 44px rgba(40,30,20,.12); cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.3,1.2), box-shadow .2s; }
.float:hover { transform: translateY(-6px) rotate(0deg) !important; }

.f2 { left: 160px; top: 235px; transform: rotate(2deg); z-index: 2; } .f2 .n { background: var(--c2); }
.f3 { right: 0; top: 0; transform: rotate(3deg); } .f3 .n { background: var(--c3); }
.home-extra { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.pillstat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; min-width: 86px; box-shadow: 0 1px 2px rgba(40,30,20,.04); }
.pillstat b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pillstat span { font-family: var(--f-display); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.formula-link { margin-top: 18px; }

.tally.hot { background: color-mix(in srgb, var(--c2) 14%, var(--surface)); border-color: color-mix(in srgb, var(--c2) 40%, var(--line)); color: var(--c2); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 16px; }

@media (max-width: 820px) {

}

/* ===== Motion + organization pass ===== */
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.rise { animation: rise .55s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i, 0) * 50ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.view.enter { animation: viewIn .4s cubic-bezier(.2,.7,.2,1) backwards; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
.big span { display: inline-block; animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
.big .w2 { animation-delay: .08s; } .big .w3 { animation-delay: .16s; }
.float { animation: bob 7s ease-in-out infinite; }
.f2 { animation-delay: -2.3s; } .f3 { animation-delay: -4.6s; }

.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }

.ai-thinking { display: flex; align-items: center; gap: 10px; }

.shimmer { font-family: var(--f-display); font-weight: 600; background: linear-gradient(90deg, var(--muted) 20%, var(--ink) 50%, var(--muted) 80%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.6s linear infinite; }

/* Headline: subject-colored with a crisp offset shadow */

.g-best { margin-top: auto; justify-self: start; background: rgba(255,255,255,.2); border-radius: 999px; padding: 5px 12px; font-family: var(--f-display); font-weight: 600; font-size: 13px; }
.g-art { position: absolute; right: -30px; bottom: -30px; width: 140px; height: 140px; border-radius: 40px; background: rgba(255,255,255,.14); transform: rotate(18deg); }
.g-speed { background: linear-gradient(140deg, #ff8a3d, #e5484d); box-shadow: 0 16px 34px rgba(229,72,77,.28); }

.arcade-play { max-width: 860px; margin: 0 auto; }

.match-card { text-align: left; min-height: 64px; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line-strong); background: var(--surface); font-family: var(--f-display); font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; box-shadow: 0 2px 0 var(--line-strong); transition: transform .15s, opacity .3s, border-color .15s, background .15s; overflow-x: auto; }
.match-card.def { font-family: var(--f-body); font-weight: 400; font-size: 14.5px; color: var(--ink-2); }
.match-card:hover:not(:disabled) { border-color: var(--accent); }
.match-card.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 2px 0 var(--accent); }
.match-card.bad { border-color: var(--bad); background: var(--bad-soft); }
.match-card.gone { opacity: 0; transform: scale(.9); pointer-events: none; }
.flash-wrap { display: grid; justify-items: center; gap: 16px; margin-top: 8px; }
.flash { width: min(560px, 100%); height: 320px; perspective: 1200px; border: 0; background: none; padding: 0; cursor: pointer; }
.flash-inner { position: relative; display: block; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; padding: 28px; border-radius: 26px; background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: auto; }
.flash-face.back { transform: rotateY(180deg); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border-color: var(--accent-line); }
.flash-text { font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 3vw, 28px); color: var(--ink); }
.flash-face.back .flash-text { font-family: var(--f-body); font-weight: 500; font-size: clamp(17px, 2.4vw, 21px); max-width: none; }
.flash-acts .btn { min-width: 140px; }

.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; margin-top: 24px; align-items: start; }
.cal-card { padding: 20px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.cal-head h2 { font-size: 22px; }
.cal-head .icon-btn { width: 36px; height: 36px; font-size: 22px; border: 1px solid var(--line); }
.cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-dow span { text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; }
.cal-cell { min-height: 86px; display: grid; grid-template-rows: auto 1fr; gap: 4px; align-content: start; text-align: left; padding: 7px; border-radius: 12px; border: 1px solid transparent; background: var(--surface-2); cursor: pointer; font: inherit; color: var(--ink); min-width: 0; transition: border-color .12s, background .12s; }
.cal-cell.empty { background: transparent; cursor: default; }
.cal-cell:not(.empty):hover { border-color: var(--line-strong); }
.cal-num { font-family: var(--f-display); font-weight: 600; font-size: 14px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.cal-cell.today .cal-num { background: var(--accent); color: var(--accent-ink); }
.cal-cell.sel { border-color: var(--accent); background: var(--accent-soft); }
.cal-evs { display: grid; gap: 3px; min-width: 0; }
.cal-ev { font-size: 11px; line-height: 1.3; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--ec) 18%, var(--surface)); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--ec); }
.cal-more { font-size: 11px; color: var(--muted); }
.cal-side { display: grid; gap: 14px; }
.ev-form { padding: 18px; display: grid; gap: 12px; }
.ev-form h3 { font-size: 17px; }

.onboard { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: var(--bg); overflow-y: auto; animation: viewIn .35s ease backwards; }
.onboard.out { opacity: 0; transition: opacity .25s; }
.ob-blob { position: fixed; inset: 10% 15%; opacity: .35; }
.ob-card { position: relative; width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 32px; box-shadow: 0 30px 80px rgba(20,10,60,.18); display: grid; gap: 22px; }
.ob-dots { display: flex; gap: 6px; }
.ob-dots span { width: 28px; height: 6px; border-radius: 99px; background: var(--line); transition: background .3s; }
.ob-dots span.on { background: var(--c3); }
.ob-body { display: grid; gap: 14px; }
.ob-body h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em; }
.ob-sub { color: var(--muted); font-size: 16px; }
.ob-orb { width: 54px; height: 54px; }
.ob-orb svg { width: 26px; height: 26px; }
.ob-input { font-size: 20px; padding: 14px 18px; border-radius: 16px; }
.ob-chips .pill { font-size: 15px; padding: 9px 18px; }
.ob-cats { display: grid; gap: 14px; }
.ob-cat { display: grid; gap: 8px; }
.ob-cat .mono { color: var(--muted); }
.ob-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
body.no-scroll { overflow: hidden; }

.notes-seg { flex-wrap: wrap; }
.notes-seg button { flex: 1 1 120px; }
.rec-panel { display: flex; align-items: center; gap: 18px; padding: 18px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); }
.rec-btn { width: 64px; height: 64px; border-radius: 50%; border: 0; background: #e5484d; cursor: pointer; display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px rgba(229,72,77,.35); transition: transform .15s; }
.rec-btn:hover { transform: scale(1.05); }
.rec-dot { width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: border-radius .2s, width .2s, height .2s; }
.rec-btn.on { animation: recPulse 1.4s ease-in-out infinite; }
.rec-btn.on .rec-dot { border-radius: 5px; width: 20px; height: 20px; }
@keyframes recPulse { 50% { box-shadow: 0 0 0 12px rgba(229,72,77,.18); } }
.yt-steps { padding: 14px 18px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14.5px; }
.yt-steps ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; color: var(--ink-2); }
.xp-earned b { color: var(--c3); }

@media (max-width: 1100px) { .games { grid-template-columns: 1fr 1fr; } .cal-layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .mtop { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .mtop .brand { font-size: 19px; cursor: pointer; }
  .sidebar { transform: translateX(-105%); transition: transform .3s cubic-bezier(.2,.7,.2,1); box-shadow: 0 0 40px rgba(0,0,0,.2); width: min(290px, 86vw); }
  body.drawer-open .sidebar { transform: none; }
  body.drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(10,8,25,.4); }
  main { margin-left: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bottombar { grid-template-columns: repeat(5, 1fr) !important; }
  .bottombar button { font-size: 11px !important; }
  .home { grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .games { grid-template-columns: minmax(0, 1fr); }
  .game-tile { min-height: 170px; }
  .course-bar { padding-left: 12px; }
  .ctabs { width: 100%; overflow-x: auto; }
  .ctabs button { flex: 1; white-space: nowrap; }
  .cal-cell { min-height: 54px; padding: 4px; }
  .cal-ev { font-size: 0; padding: 0; height: 6px; border-left-width: 0; background: var(--ec); }
  .match-board { gap: 8px; }
  .match-card { min-height: 56px; padding: 10px 12px; font-size: 14px; }
  .flash { height: 260px; }
  .ob-card { padding: 24px; }
}

/* Topics */
.side-topic { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 11px; padding: 8px 11px; font-family: var(--f-display); font-weight: 500; font-size: 14.5px; color: var(--ink-2); cursor: pointer; transition: background .15s, color .15s; }
.side-topic:hover { background: var(--surface-2); color: var(--ink); }
.ticon { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--surface)); transition: background .15s, color .15s; }
.ticon svg { width: 16px; height: 16px; }
.side-topic[aria-current="true"] { background: color-mix(in srgb, var(--tc) 12%, var(--surface)); color: var(--ink); font-weight: 600; }
.side-topic[aria-current="true"] .ticon { background: var(--tc); color: #fff; }
.side-now { display: flex; align-items: center; gap: 9px; margin: 2px 0 0 26px; padding: 6px 11px; border-left: 2px solid var(--line); font-size: 13.5px; color: var(--ink); font-weight: 600; }
.side-now .sdot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.crumb { border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.crumb:hover { color: var(--ink); background: var(--surface-2); }
.crumb-sep { color: var(--muted); }
.topic-hero { display: flex; align-items: center; gap: 22px; padding: 26px 28px; border-radius: 26px; background: linear-gradient(135deg, color-mix(in srgb, var(--tc) 16%, var(--surface)), var(--surface) 70%); border: 1px solid color-mix(in srgb, var(--tc) 25%, var(--line)); }
.topic-hero h1 { font-size: clamp(34px, 5vw, 50px); font-weight: 800; letter-spacing: -0.035em; margin-top: 4px; color: color-mix(in srgb, var(--tc) 70%, var(--ink)); }
.topic-hero .eyebrow { color: var(--tc); }
.topic-icon { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; flex: none; color: #fff; background: var(--tc); box-shadow: 0 12px 28px color-mix(in srgb, var(--tc) 35%, transparent); }
.topic-icon svg { width: 36px; height: 36px; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.course-card { text-align: left; display: grid; gap: 8px; grid-template-rows: auto auto 1fr auto; padding: 18px 20px; cursor: pointer; border-top: 4px solid var(--sc); transition: transform .15s, box-shadow .15s; font: inherit; color: var(--ink); }
.course-card:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(40,30,20,.12); }
.course-card h3 { font-size: 19px; }
.course-card p { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cc-dot { width: 12px; height: 12px; border-radius: 4px; background: var(--sc); }
.cc-foot { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; }
.sugg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.sugg-card { text-align: left; display: grid; gap: 6px; padding: 16px 18px; cursor: pointer; border: 1.5px dashed color-mix(in srgb, var(--sc) 45%, var(--line-strong)); background: color-mix(in srgb, var(--sc) 5%, var(--surface)); box-shadow: none; font: inherit; color: var(--ink); transition: transform .15s, border-color .15s, background .15s; }
.sugg-card:hover:not(:disabled) { transform: translateY(-2px); border-style: solid; background: color-mix(in srgb, var(--sc) 10%, var(--surface)); }
.sugg-card:disabled { cursor: default; opacity: .6; }
.sugg-card.building { opacity: 1; border-style: solid; border-color: var(--sc); }
.sugg-card b { font-family: var(--f-display); font-size: 16.5px; }
.sugg-card .muted { font-size: 13px; }
.sugg-status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.topic-custom { display: flex; gap: 10px; max-width: 680px; }
.topic-custom .input { flex: 1; font-size: 16px; padding: 12px 16px; border-radius: 14px; }
.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; margin-top: 24px; }
.topic-tile { text-align: left; display: grid; gap: 8px; padding: 22px; border-radius: 24px; cursor: pointer; border: 1px solid color-mix(in srgb, var(--tc) 25%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 14%, var(--surface)), var(--surface) 75%); font: inherit; color: var(--ink); transition: transform .2s cubic-bezier(.2,.8,.3,1.3), box-shadow .2s; }
.topic-tile:hover { transform: translateY(-3px); box-shadow: 0 16px 36px color-mix(in srgb, var(--tc) 20%, transparent); }
.topic-tile .topic-icon { width: 54px; height: 54px; border-radius: 16px; }
.topic-tile .topic-icon svg { width: 26px; height: 26px; }
.topic-tile h3 { font-size: 22px; font-weight: 800; margin-top: 6px; }
.topic-tile p { color: var(--ink-2); font-size: 14px; }
.topic-tile .muted { font-size: 13px; }
@media (max-width: 900px) { .topic-hero { padding: 20px; gap: 16px; } .topic-icon { width: 56px; height: 56px; border-radius: 18px; } .topic-icon svg { width: 28px; height: 28px; } .topic-custom { flex-direction: column; } }

/* Flip-card quiz */
.qflip-wrap { perspective: 1600px; }
.qflip-wrap.deal { animation: deal .45s cubic-bezier(.2,.8,.3,1.2) backwards; }
@keyframes deal { from { opacity: 0; transform: translateY(18px) rotate(-1.5deg) scale(.97); } }
.qflip { position: relative; }
.qflip-inner { display: grid; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.2,1); }
.qflip.flipped .qflip-inner { transform: rotateY(180deg); }
.qface { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1.5px solid var(--line); border-radius: 26px; padding: 30px 34px; box-shadow: 0 2px 6px rgba(40,30,20,.04), 0 18px 40px rgba(40,30,20,.09); min-height: 340px; display: flex; flex-direction: column; gap: 6px; }
.qback { transform: rotateY(180deg); justify-content: flex-start; }
.qface-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.flip-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: 16px; }
.card-choices { margin-top: 22px; }
.card-choices .choice { border-radius: 16px; }
.card-hint { margin-top: 16px; padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); font-size: 15px; }
.card-hint b { color: var(--warn); }
.front-foot { margin-top: auto; padding-top: 18px; display: flex; justify-content: space-between; align-items: center; }
.qback.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); background: linear-gradient(170deg, var(--good-soft), var(--surface) 55%); }
.qback.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: linear-gradient(170deg, var(--bad-soft), var(--surface) 55%); }
.back-top { display: flex; align-items: center; gap: 16px; }
.big-mark { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: #fff; flex: none; background: var(--bad); box-shadow: 0 8px 20px color-mix(in srgb, var(--bad) 30%, transparent); }
.qback.good .big-mark { background: var(--good); box-shadow: 0 8px 20px color-mix(in srgb, var(--good) 35%, transparent); }
.qflip.flipped .big-mark { animation: markPop .5s .35s cubic-bezier(.2,.9,.3,1.5) backwards; }
@keyframes markPop { from { transform: scale(.3); opacity: 0; } }
.back-verdict { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; }
.qback.good .back-verdict { color: var(--good); }
.qback.bad .back-verdict { color: var(--bad); font-size: 19px; }
.back-answer { margin-top: 4px; font-weight: 600; color: var(--ink); font-size: 16.5px; }
.back-sol { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 15.5px; max-width: none; }
.mini-burst { position: absolute; left: 50%; top: 34%; width: 0; height: 0; pointer-events: none; z-index: 5; }
.mini-burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; opacity: 0; animation: burst .9s cubic-bezier(.15,.8,.3,1) forwards; }
@keyframes burst { 0% { opacity: 1; transform: translate(0,0) rotate(0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.6); } }
.recs { margin-top: 18px; display: grid; gap: 8px; }
.rec-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.rec-card { display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 15px; border-radius: 16px; border: 1.5px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); cursor: pointer; font: inherit; color: var(--ink); transition: transform .15s; }
.rec-card:hover { transform: translateY(-2px); }
.rec-card > span:last-child { display: grid; min-width: 0; }
.rec-card b { font-family: var(--f-display); font-size: 14.5px; }
.rec-card .muted { font-size: 12.5px; }
.num-answer .btn { flex: none; }
@media (max-width: 900px) { .qface { padding: 22px 18px; min-height: 300px; border-radius: 22px; } .back-verdict { font-size: 21px; } .big-mark { width: 52px; height: 52px; font-size: 25px; } }

.yt-link { font-size: 16px; padding: 13px 16px; }
.yt-fallback { border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; background: var(--surface); }
.yt-fallback summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.yt-fallback[open] summary { margin-bottom: 12px; }
.yt-fallback .yt-steps { margin-bottom: 12px; }

/* ---- skill check, practice now, resources ---- */
.unit .u-foot { margin-top: auto; }
.practice-now { box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 65%, #000); }
.fit-chip { display: inline-flex; align-items: center; font-family: var(--f-display); font-weight: 600; font-size: 11.5px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.fit-chip.focus { background: color-mix(in srgb, #e07a1f 16%, transparent); color: color-mix(in srgb, #e07a1f 80%, var(--ink)); }
.fit-chip.known { background: color-mix(in srgb, var(--good) 15%, transparent); color: color-mix(in srgb, var(--good) 80%, var(--ink)); }
.fit-chip.none { background: var(--surface-2); color: var(--muted); }
.unit.fit-focus { border-color: color-mix(in srgb, #e07a1f 45%, var(--line)); }
.plan-card { display: flex; align-items: center; gap: 16px; padding: 18px 20px; margin: 18px 0 18px; border-radius: 20px; animation: viewIn .35s ease backwards; }
.plan-card.invite { background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--surface) 70%); border: 1.5px dashed color-mix(in srgb, var(--accent) 40%, var(--line)); }
.plan-card .orb { flex: none; width: 40px; height: 40px; }
.plan-card .orb svg { width: 20px; height: 20px; }
.plan-main { display: grid; gap: 2px; flex: 1; min-width: 0; }
.plan-main b { font-family: var(--f-display); font-size: 18px; color: var(--ink); }
.plan-main .mono { font-size: 11.5px; color: var(--accent); }
.plan-main .muted, .plan-main .error-text { font-size: 14px; }
@media (max-width: 640px) { .plan-card { flex-wrap: wrap; } .plan-card .btn { width: 100%; } }
.place-level { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.place-level b { font-family: var(--f-display); font-size: clamp(30px, 5vw, 40px); font-weight: 800; letter-spacing: -0.03em; color: var(--accent); }
.level-meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 6px; }
.level-meter span { font-size: 11.5px; font-family: var(--f-display); font-weight: 600; text-align: center; padding: 8px 4px 0; border-top: 6px solid var(--surface-2); color: var(--muted); border-radius: 3px; transition: border-color .4s; }
.level-meter span.on { border-top-color: var(--accent); color: var(--ink); }
