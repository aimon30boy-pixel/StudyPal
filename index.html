const R = String.raw;

const SUBJECTS = {
  alg1: { name: "Algebra 1", short: "Algebra 1", code: "TEKS §111.39", blurb: "Linear equations and functions, systems, exponents, factoring, quadratics and exponential growth." },
  geo:  { name: "Geometry",  short: "Geometry",  code: "TEKS §111.41", blurb: "Logic and proof, angles, transformations, congruence, similarity, trigonometry, circles, area, volume and probability." },
  alg2: { name: "Algebra 2", short: "Algebra 2", code: "TEKS §111.40", blurb: "Function families and inverses, systems, complex numbers, polynomials, radical, rational, exponential and logarithmic functions." }
};

const UNITS = {
geo: [
{ id: "g1", title: "Logic and Reasoning", teks: "G.4", sum: "Conditional statements, converses, and inductive versus deductive reasoning.",
body: R`A **conditional statement** has the form "If \(p\), then \(q\)," written \(p \to q\). The part after *if* is the **hypothesis**; the part after *then* is the **conclusion**.

### Related conditionals
- **Converse:** \(q \to p\) (swap the parts)
- **Inverse:** \(\neg p \to \neg q\) (negate both)
- **Contrapositive:** \(\neg q \to \neg p\) (swap and negate)

A conditional and its contrapositive always have the same truth value, so they are **logically equivalent**. The converse and inverse are equivalent to each other. When a conditional and its converse are both true, you can write a **biconditional**: "\(p\) if and only if \(q\)." Every good definition is a biconditional.

### Two kinds of reasoning
**Inductive reasoning** looks at examples, finds a pattern, and makes a conjecture. It can be wrong, and a single **counterexample** proves a conjecture false.

**Deductive reasoning** uses facts, definitions and accepted rules to reach a conclusion that must be true. Two key rules:
- **Law of Detachment:** if \(p \to q\) is true and \(p\) is true, then \(q\) is true.
- **Law of Syllogism:** if \(p \to q\) and \(q \to r\) are true, then \(p \to r\) is true.

Geometric proofs are chains of deductive steps.`,
keys: [R`Contrapositive \(\neg q \to \neg p\) is equivalent to the original.`, "Converse and inverse can be false even when the original is true.", "One counterexample disproves a conjecture.", "Proofs use deductive reasoning only."],
ex: { p: R`Write the converse, inverse and contrapositive of "If a number is divisible by 4, then it is even." Which are true?`,
  steps: [R`**Converse:** If a number is even, then it is divisible by 4. False: 6 is even but not divisible by 4.`, R`**Inverse:** If a number is not divisible by 4, then it is not even. False: 6 again.`, R`**Contrapositive:** If a number is not even, then it is not divisible by 4. True, as is the original.`], ans: "Only the original and the contrapositive are true." },
qs: [
 { type: "mc", q: R`What is the contrapositive of "If two angles are vertical angles, then they are congruent"?`, choices: ["If two angles are congruent, then they are vertical angles.", "If two angles are not vertical angles, then they are not congruent.", "If two angles are not congruent, then they are not vertical angles.", "Two angles are vertical if and only if they are congruent."], a: 2, hint: "Swap the hypothesis and conclusion, then negate both.", sol: R`Swap and negate: "If two angles are **not congruent**, then they are **not vertical angles**." It has the same truth value as the original.` },
 { type: "mc", q: R`Which number is a counterexample to the conjecture "All prime numbers are odd"?`, choices: ["1", "2", "9", "15"], a: 1, hint: "A counterexample must be prime and must not be odd.", sol: R`2 is prime and even, so it disproves the conjecture. (1 is not prime; 9 and 15 are odd and not prime.)` },
 { type: "mc", q: R`Given: "If it rains, the game is canceled." and "If the game is canceled, the team practices indoors." Which conclusion follows by the Law of Syllogism?`, choices: ["If the team practices indoors, it rained.", "If it rains, the team practices indoors.", "If the game is not canceled, it did not rain.", "The team practices indoors."], a: 1, hint: R`Chain \(p \to q\) and \(q \to r\) into \(p \to r\).`, sol: R`With \(p\): it rains, \(q\): the game is canceled, \(r\): the team practices indoors, syllogism gives \(p \to r\): "If it rains, the team practices indoors."` }
]},
{ id: "g2", title: "Lines, Angles and Parallel Lines", teks: "G.5, G.6", sum: "Angle pairs, transversals, and proving lines parallel.",
body: R`### Angle pairs
- **Complementary** angles add to \(90^\circ\); **supplementary** angles add to \(180^\circ\).
- A **linear pair** is two adjacent angles whose outer sides form a line, so they are supplementary.
- **Vertical angles** are opposite each other where two lines cross, and they are always congruent.

### Parallel lines cut by a transversal
When a transversal crosses two **parallel** lines, eight angles form in two matching groups:
- **Corresponding angles** are congruent.
- **Alternate interior angles** are congruent.
- **Alternate exterior angles** are congruent.
- **Same-side (consecutive) interior angles** are supplementary.

The **converses** are also true, and they are how you prove two lines are parallel: if corresponding angles are congruent, the lines are parallel, and so on.

### Polygons
The interior angles of an \(n\)-sided polygon add to \((n-2)\cdot 180^\circ\). The exterior angles, one at each vertex, always add to \(360^\circ\).`,
keys: ["Vertical angles are congruent.", "Parallel lines: corresponding, alternate interior and alternate exterior angles are congruent.", "Same-side interior angles are supplementary.", R`Polygon interior sum: \((n-2)180^\circ\).`],
ex: { p: R`Two parallel lines are cut by a transversal. One angle measures \((3x+10)^\circ\) and its alternate interior angle measures \((5x-30)^\circ\). Find \(x\) and the angle measure.`,
  steps: [R`Alternate interior angles are congruent, so \(3x + 10 = 5x - 30\).`, R`Subtract \(3x\) and add 30: \(40 = 2x\), so \(x = 20\).`, R`Angle: \(3(20) + 10 = 70^\circ\). Check: \(5(20) - 30 = 70^\circ\).`], ans: R`\(x = 20\), angle \(= 70^\circ\)` },
qs: [
 { type: "num", q: R`Two angles are supplementary. One angle is 4 times the other. What is the measure of the smaller angle, in degrees?`, a: 36, hint: R`Let the smaller angle be \(x\). Then \(x + 4x = 180\).`, sol: R`\(5x = 180\), so \(x = 36^\circ\). The larger angle is \(144^\circ\).` },
 { type: "num", q: R`Parallel lines are cut by a transversal. Two same-side interior angles measure \((2x+15)^\circ\) and \((3x-10)^\circ\). Find \(x\).`, a: 35, hint: "Same-side interior angles are supplementary.", sol: R`\((2x+15)+(3x-10)=180 \Rightarrow 5x + 5 = 180 \Rightarrow x = 35\).` },
 { type: "num", q: R`What is the measure, in degrees, of each interior angle of a regular octagon?`, a: 135, hint: R`Find the interior sum \((n-2)180\), then divide by 8.`, sol: R`Sum \(= (8-2)\cdot 180 = 1080^\circ\). Each angle \(= 1080/8 = 135^\circ\).` }
]},
{ id: "g3", title: "Coordinate Geometry", teks: "G.2", sum: "Distance, midpoint, slope, and partitioning a segment.",
body: R`For points \(A(x_1, y_1)\) and \(B(x_2, y_2)\):

- **Distance:** \(d = \sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}\) (the Pythagorean theorem on the grid)
- **Midpoint:** \(M = \left(\frac{x_1+x_2}{2}, \frac{y_1+y_2}{2}\right)\)
- **Slope:** \(m = \frac{y_2 - y_1}{x_2 - x_1}\)

### Parallel and perpendicular
Parallel lines have **equal slopes**. Perpendicular lines have slopes that are **negative reciprocals**, so their product is \(-1\) (for example \(\frac{2}{3}\) and \(-\frac{3}{2}\)).

### Partitioning a segment
To find the point \(P\) that divides \(\overline{AB}\) in the ratio \(a:b\) starting from \(A\), move the fraction \(\frac{a}{a+b}\) of the way:
$$P = \left(x_1 + \tfrac{a}{a+b}(x_2 - x_1),\; y_1 + \tfrac{a}{a+b}(y_2 - y_1)\right)$$

These tools let you classify figures on the coordinate plane: for example, show a quadrilateral is a parallelogram by proving both pairs of opposite sides are parallel.`,
keys: ["Distance formula comes from the Pythagorean theorem.", "Parallel: same slope. Perpendicular: slopes multiply to −1.", R`Partition ratio \(a:b\) means moving \(\frac{a}{a+b}\) of the way.`],
ex: { p: R`For \(A(-2, 1)\) and \(B(4, 9)\), find the length, midpoint and slope of \(\overline{AB}\), and the slope of a line perpendicular to it.`,
  steps: [R`Distance: \(\sqrt{(4+2)^2 + (9-1)^2} = \sqrt{36 + 64} = \sqrt{100} = 10\).`, R`Midpoint: \(\left(\frac{-2+4}{2}, \frac{1+9}{2}\right) = (1, 5)\).`, R`Slope: \(\frac{9-1}{4+2} = \frac{8}{6} = \frac{4}{3}\). Perpendicular slope: \(-\frac{3}{4}\).`], ans: R`\(10\); \((1,5)\); \(\frac43\); \(-\frac34\)` },
qs: [
 { type: "num", q: R`Find the distance between \((1, 2)\) and \((7, 10)\).`, a: 10, hint: R`Differences are 6 and 8.`, sol: R`\(\sqrt{6^2 + 8^2} = \sqrt{100} = 10\).` },
 { type: "mc", q: R`Which line passes through \((0, 3)\) and is perpendicular to \(y = 2x - 5\)?`, choices: [R`\(y = 2x + 3\)`, R`\(y = -2x + 3\)`, R`\(y = -\tfrac{1}{2}x + 3\)`, R`\(y = \tfrac{1}{2}x + 3\)`], a: 2, hint: "Use the negative reciprocal of 2.", sol: R`The perpendicular slope is \(-\frac12\) and the y-intercept is 3: \(y = -\frac12 x + 3\).` },
 { type: "num", q: R`Point \(P\) divides the segment from \(A(0, 0)\) to \(B(10, 5)\) in the ratio \(2:3\), starting from \(A\). What is the x-coordinate of \(P\)?`, a: 4, hint: R`Move \(\frac{2}{5}\) of the way from A to B.`, sol: R`\(x = 0 + \frac{2}{5}(10 - 0) = 4\). (The point is \((4, 2)\).)` }
]},
{ id: "g4", title: "Transformations", teks: "G.3", sum: "Translations, reflections, rotations, dilations, and what they preserve.",
body: R`A **transformation** maps every point of a figure (the pre-image) to a new point (the image).

### Rigid motions
**Translations, reflections and rotations** preserve distance and angle measure, so the image is **congruent** to the pre-image.

| Transformation | Rule |
|---|---|
| Translation | \((x, y) \to (x + a, y + b)\) |
| Reflect over x-axis | \((x, y) \to (x, -y)\) |
| Reflect over y-axis | \((x, y) \to (-x, y)\) |
| Reflect over \(y = x\) | \((x, y) \to (y, x)\) |
| Rotate \(90^\circ\) counterclockwise | \((x, y) \to (-y, x)\) |
| Rotate \(180^\circ\) | \((x, y) \to (-x, -y)\) |
| Rotate \(270^\circ\) counterclockwise | \((x, y) \to (y, -x)\) |

### Dilations
A dilation with center at the origin and scale factor \(k\) maps \((x, y) \to (kx, ky)\). It preserves angle measure but multiplies lengths by \(k\), so the image is **similar**, not congruent (unless \(k = 1\)). If \(k > 1\) it is an enlargement; if \(0 < k < 1\) it is a reduction.

In a **composition**, apply transformations in order, right after one another.`,
keys: ["Rigid motions give congruent figures.", "Dilations give similar figures with lengths times k.", R`Rotate \(90^\circ\) CCW: \((x,y)\to(-y,x)\).`, "Order matters in a composition."],
ex: { p: R`The point \((3, -1)\) is rotated \(90^\circ\) counterclockwise about the origin, then reflected over the y-axis. Find its final image.`,
  steps: [R`Rotation: \((x, y) \to (-y, x)\) gives \((1, 3)\).`, R`Reflection over the y-axis: \((x, y) \to (-x, y)\) gives \((-1, 3)\).`], ans: R`\((-1, 3)\)` },
qs: [
 { type: "mc", q: R`What is the image of \((2, 5)\) after a reflection over the line \(y = x\)?`, choices: [R`\((-2, 5)\)`, R`\((5, 2)\)`, R`\((-5, -2)\)`, R`\((2, -5)\)`], a: 1, hint: "Reflecting over y = x swaps the coordinates.", sol: R`\((x, y) \to (y, x)\), so \((2,5) \to (5,2)\).` },
 { type: "mc", q: "Which transformation does not always produce a congruent image?", choices: ["Translation", "Reflection", "Rotation", "Dilation"], a: 3, hint: "Which one changes size?", sol: R`A dilation with \(k \ne 1\) changes lengths, so the image is similar but not congruent.` },
 { type: "num", q: R`A segment of length 4 is dilated by a scale factor of 3 about the origin. What is the length of the image?`, a: 12, hint: "Lengths are multiplied by k.", sol: R`\(4 \times 3 = 12\).` }
]},
{ id: "g5", title: "Triangle Congruence and Proof", teks: "G.6", sum: "Triangle angle facts, congruence shortcuts, isosceles triangles, and two-column proofs.",
body: R`### Angle facts
- The interior angles of a triangle add to \(180^\circ\).
- **Exterior Angle Theorem:** an exterior angle equals the sum of the two remote interior angles.

### Proving triangles congruent
You do not need all six pairs of parts. These shortcuts work:
- **SSS** — three pairs of sides
- **SAS** — two sides and the **included** angle
- **ASA** — two angles and the included side
- **AAS** — two angles and a non-included side
- **HL** — hypotenuse and a leg of right triangles

**SSA** and **AAA** do **not** prove congruence. Once triangles are congruent, **CPCTC** (corresponding parts of congruent triangles are congruent) gives you any other matching part.

### Isosceles triangles
If two sides are congruent, the angles opposite them (the **base angles**) are congruent, and the converse is true. An equilateral triangle is also equiangular, with \(60^\circ\) angles.

### Two-column proofs
List each **statement** with its **reason**: given, a definition, a postulate or a theorem. Start from the givens and end with what you were asked to prove.`,
keys: ["Triangle angles sum to 180°.", "Exterior angle = sum of remote interior angles.", "SSS, SAS, ASA, AAS, HL work; SSA and AAA do not.", "Base angles of an isosceles triangle are congruent."],
ex: { p: R`In \(\triangle ABC\), \(m\angle A = 50^\circ\) and the exterior angle at \(C\) measures \(115^\circ\). Find \(m\angle B\) and \(m\angle ACB\).`,
  steps: [R`Exterior Angle Theorem: \(m\angle A + m\angle B = 115^\circ\), so \(m\angle B = 65^\circ\).`, R`Linear pair: \(m\angle ACB = 180^\circ - 115^\circ = 65^\circ\).`, R`Check: \(50 + 65 + 65 = 180\). Since \(\angle B \cong \angle ACB\), the triangle is isosceles with \(AB = AC\).`], ans: R`\(m\angle B = 65^\circ\), \(m\angle ACB = 65^\circ\)` },
qs: [
 { type: "num", q: R`The angles of a triangle measure \(x^\circ\), \(2x^\circ\) and \(3x^\circ\). What is the measure of the largest angle?`, a: 90, hint: "Add them and set equal to 180.", sol: R`\(6x = 180\), so \(x = 30\) and the largest angle is \(3x = 90^\circ\).` },
 { type: "mc", q: "Which of these cannot be used to prove two triangles congruent?", choices: ["SAS", "ASA", "SSA", "HL"], a: 2, hint: "One of these allows two different triangles.", sol: "SSA (two sides and a non-included angle) can describe two different triangles, so it does not prove congruence." },
 { type: "num", q: R`The vertex angle of an isosceles triangle measures \(40^\circ\). What is the measure of each base angle?`, a: 70, hint: "The two base angles are equal and share what is left of 180°.", sol: R`\((180 - 40)/2 = 70^\circ\).` }
]},
{ id: "g6", title: "Similarity", teks: "G.7, G.8", sum: "Similar figures, AA similarity, proportional segments, and the geometric mean.",
body: R`Two figures are **similar** (\(\sim\)) when corresponding angles are congruent and corresponding sides are proportional. The common ratio is the **scale factor** \(k\).

### Proving triangles similar
- **AA** — two pairs of congruent angles
- **SSS~** — all three side ratios equal
- **SAS~** — two side ratios equal and the included angles congruent

### Proportional segments
**Triangle Proportionality Theorem:** a line parallel to one side of a triangle divides the other two sides proportionally. The **Angle Bisector Theorem** says an angle bisector divides the opposite side in the ratio of the adjacent sides.

### Right triangle with an altitude
Drawing the altitude to the hypotenuse creates three similar triangles. If the altitude \(h\) splits the hypotenuse into segments \(x\) and \(y\):
$$h^2 = xy \qquad \text{leg}^2 = (\text{hypotenuse})(\text{adjacent segment})$$
\(h\) is the **geometric mean** of \(x\) and \(y\).

### Scale factor effects
If the scale factor is \(k\): perimeters scale by \(k\), areas by \(k^2\), volumes by \(k^3\).`,
keys: ["AA is the quickest way to prove triangles similar.", "Parallel line → proportional sides.", R`Altitude to hypotenuse: \(h^2 = xy\).`, R`Perimeter ×k, area ×k², volume ×k³.`],
ex: { p: R`\(\triangle ABC \sim \triangle DEF\) with \(AB = 6\), \(DE = 9\) and \(BC = 8\). Find \(EF\) and the ratio of the areas.`,
  steps: [R`Scale factor from \(ABC\) to \(DEF\): \(k = \frac{9}{6} = \frac{3}{2}\).`, R`\(EF = \frac{3}{2}\cdot 8 = 12\).`, R`Area ratio \(ABC : DEF = \left(\frac{2}{3}\right)^2 = \frac{4}{9}\).`], ans: R`\(EF = 12\); areas \(4:9\)` },
qs: [
 { type: "num", q: R`Two similar triangles have a scale factor of 3. The smaller triangle has an area of 10 square units. What is the area of the larger triangle?`, a: 90, hint: "Areas scale by the square of the scale factor.", sol: R`\(10 \cdot 3^2 = 90\).` },
 { type: "num", q: R`In \(\triangle ABC\), \(\overline{DE} \parallel \overline{BC}\) with \(D\) on \(\overline{AB}\) and \(E\) on \(\overline{AC}\). If \(AD = 4\), \(DB = 6\) and \(AE = 5\), find \(EC\).`, a: 7.5, hint: R`\(\frac{AD}{DB} = \frac{AE}{EC}\).`, sol: R`\(\frac{4}{6} = \frac{5}{EC} \Rightarrow 4\,EC = 30 \Rightarrow EC = 7.5\).` },
 { type: "num", q: R`The altitude to the hypotenuse of a right triangle divides the hypotenuse into segments of length 4 and 9. How long is the altitude?`, a: 6, hint: "The altitude is the geometric mean of the two segments.", sol: R`\(h = \sqrt{4 \cdot 9} = \sqrt{36} = 6\).` }
]},
{ id: "g7", title: "Right Triangles and Trigonometry", teks: "G.9", sum: "Pythagorean theorem, special right triangles, and SOH-CAH-TOA.",
body: R`### Pythagorean theorem
In a right triangle with legs \(a, b\) and hypotenuse \(c\): \(a^2 + b^2 = c^2\). The converse classifies any triangle with longest side \(c\):
- \(c^2 = a^2 + b^2\): right
- \(c^2 < a^2 + b^2\): acute
- \(c^2 > a^2 + b^2\): obtuse

### Special right triangles
- **45°–45°–90°:** sides \(x,\ x,\ x\sqrt{2}\)
- **30°–60°–90°:** sides \(x,\ x\sqrt{3},\ 2x\) (short leg, long leg, hypotenuse)

### Trigonometric ratios
For an acute angle \(\theta\) in a right triangle:
$$\sin\theta = \frac{\text{opp}}{\text{hyp}}, \quad \cos\theta = \frac{\text{adj}}{\text{hyp}}, \quad \tan\theta = \frac{\text{opp}}{\text{adj}}$$
Remember **SOH-CAH-TOA**. To find an angle from two sides, use the inverse: \(\theta = \tan^{-1}\left(\frac{\text{opp}}{\text{adj}}\right)\), and similarly for sine and cosine. Make sure your calculator is in **degree** mode.

An **angle of elevation** is measured up from horizontal; an **angle of depression** is measured down from horizontal. They are congruent (alternate interior angles).`,
keys: [R`\(a^2+b^2=c^2\), and its converse classifies triangles.`, R`45-45-90: \(x, x, x\sqrt2\). 30-60-90: \(x, x\sqrt3, 2x\).`, "SOH-CAH-TOA; inverse trig finds angles.", "Calculator in degree mode."],
ex: { p: R`A 20-foot ladder leans against a wall, making a \(70^\circ\) angle with the ground. How high up the wall does it reach, to the nearest tenth of a foot?`,
  steps: [R`The height is opposite the \(70^\circ\) angle and the ladder is the hypotenuse, so use sine.`, R`\(\sin 70^\circ = \frac{h}{20} \Rightarrow h = 20 \sin 70^\circ\).`, R`\(h \approx 20(0.9397) \approx 18.8\) ft.`], ans: "About 18.8 ft" },
qs: [
 { type: "num", q: R`In a \(30^\circ\)–\(60^\circ\)–\(90^\circ\) triangle, the shorter leg is 5. How long is the hypotenuse?`, a: 10, hint: "The hypotenuse is twice the shorter leg.", sol: R`Hypotenuse \(= 2x = 2(5) = 10\).` },
 { type: "num", q: R`From a point 50 m from the base of a tower, the angle of elevation to the top is \(35^\circ\). How tall is the tower, to the nearest tenth of a meter?`, a: 35.0, hint: "The height is opposite the angle; 50 m is adjacent. Use tangent.", sol: R`\(h = 50 \tan 35^\circ \approx 50(0.7002) \approx 35.0\) m.` },
 { type: "mc", q: "A triangle has sides 7, 8 and 12. What kind of triangle is it?", choices: ["Acute", "Right", "Obtuse", "Not a triangle"], a: 2, hint: R`Compare \(12^2\) with \(7^2 + 8^2\).`, sol: R`\(12^2 = 144\) and \(7^2 + 8^2 = 113\). Since \(144 > 113\), the triangle is obtuse. (It is a triangle because \(7 + 8 > 12\).)` }
]},
{ id: "g8", title: "Circles", teks: "G.12", sum: "Arcs and angles, chords and tangents, arc length, sector area, and the circle equation.",
body: R`### Angles and arcs
- A **central angle** has the same measure as its intercepted arc.
- An **inscribed angle** is **half** its intercepted arc. An angle inscribed in a semicircle is a right angle.
- Opposite angles of a quadrilateral inscribed in a circle are supplementary.

### Tangents and chords
- A tangent is perpendicular to the radius at the point of tangency.
- Two tangent segments from the same outside point are congruent.
- **Intersecting chords:** \(a \cdot b = c \cdot d\) (products of the segments of each chord)
- **Two secants from a point:** \(\text{outside} \cdot \text{whole} = \text{outside} \cdot \text{whole}\)
- **Tangent and secant:** \(t^2 = \text{outside} \cdot \text{whole}\)

### Arc length and sector area
For a central angle \(\theta\) in degrees:
$$\text{arc length} = \frac{\theta}{360}\cdot 2\pi r \qquad \text{sector area} = \frac{\theta}{360}\cdot \pi r^2$$
In radians, \(s = r\theta\). One full turn is \(360^\circ = 2\pi\) radians.

### Equation of a circle
Center \((h, k)\), radius \(r\): \((x-h)^2 + (y-k)^2 = r^2\). From general form, **complete the square** in \(x\) and in \(y\).`,
keys: ["Inscribed angle = half the intercepted arc.", "Tangent ⟂ radius.", R`Arc length \(\frac{\theta}{360}2\pi r\); sector \(\frac{\theta}{360}\pi r^2\).`, R`\((x-h)^2+(y-k)^2=r^2\).`],
ex: { p: R`Find the center and radius of \(x^2 + y^2 - 6x + 4y - 12 = 0\).`,
  steps: [R`Group: \((x^2 - 6x) + (y^2 + 4y) = 12\).`, R`Complete the squares: add 9 and 4 to both sides: \((x^2 - 6x + 9) + (y^2 + 4y + 4) = 25\).`, R`Factor: \((x-3)^2 + (y+2)^2 = 25\). Center \((3, -2)\), radius 5.`], ans: R`Center \((3,-2)\), \(r = 5\)` },
qs: [
 { type: "num", q: R`An inscribed angle intercepts an arc of \(110^\circ\). What is the measure of the angle, in degrees?`, a: 55, hint: "Inscribed angle = half the arc.", sol: R`\(110/2 = 55^\circ\).` },
 { type: "num", q: R`Find the length of an arc with a central angle of \(60^\circ\) in a circle of radius 6. Give a decimal to the nearest hundredth (or type it using pi).`, a: 6.283, hint: R`\(\frac{60}{360}\cdot 2\pi(6)\).`, sol: R`\(\frac{1}{6}\cdot 12\pi = 2\pi \approx 6.28\).` },
 { type: "num", q: R`Two chords intersect inside a circle. One chord is split into segments of 3 and 8. The other is split into segments of 4 and \(x\). Find \(x\).`, a: 6, hint: "Products of the segments are equal.", sol: R`\(3 \cdot 8 = 4x \Rightarrow x = 6\).` }
]},
{ id: "g9", title: "Area and Volume", teks: "G.10, G.11", sum: "Area of polygons and circles, surface area, volume, and the effect of scaling.",
body: R`### Area
- Triangle: \(A = \frac12 bh\); parallelogram: \(A = bh\); trapezoid: \(A = \frac12(b_1 + b_2)h\)
- Rhombus or kite: \(A = \frac12 d_1 d_2\)
- Regular polygon: \(A = \frac12 aP\) (apothem times perimeter, halved)
- Circle: \(A = \pi r^2\)

### Volume
- Prism and cylinder: \(V = Bh\) (base area times height); cylinder \(V = \pi r^2 h\)
- Pyramid and cone: \(V = \frac13 Bh\); cone \(V = \frac13 \pi r^2 h\)
- Sphere: \(V = \frac43 \pi r^3\)

### Surface area
Add the areas of all faces. Cylinder: \(2\pi r^2 + 2\pi r h\). Cone: \(\pi r^2 + \pi r \ell\), where \(\ell\) is the slant height. Sphere: \(4\pi r^2\).

**Cavalieri's principle:** solids with equal heights and equal cross-sectional areas at every level have equal volumes.

### Changing dimensions
If every length is multiplied by \(k\), area is multiplied by \(k^2\) and volume by \(k^3\). If only one dimension changes, recompute directly.`,
keys: [R`Pyramid and cone are \(\frac13\) of the matching prism or cylinder.`, R`Sphere: \(V = \frac43\pi r^3\), \(SA = 4\pi r^2\).`, "Scale lengths by k: area ×k², volume ×k³.", "Slant height ≠ height."],
ex: { p: R`A cone has radius 3 cm and height 4 cm. Find its volume and total surface area in terms of \(\pi\).`,
  steps: [R`Volume: \(\frac13\pi(3^2)(4) = 12\pi \approx 37.7\ \text{cm}^3\).`, R`Slant height: \(\ell = \sqrt{3^2 + 4^2} = 5\).`, R`Surface area: \(\pi(3^2) + \pi(3)(5) = 9\pi + 15\pi = 24\pi \approx 75.4\ \text{cm}^2\).`], ans: R`\(V = 12\pi\ \text{cm}^3\), \(SA = 24\pi\ \text{cm}^2\)` },
qs: [
 { type: "num", q: R`Find the volume of a cylinder with radius 2 and height 5, to the nearest tenth.`, a: 62.8, hint: R`\(V = \pi r^2 h\).`, sol: R`\(\pi(2^2)(5) = 20\pi \approx 62.8\).` },
 { type: "num", q: "Every dimension of a box is tripled. By what factor is the volume multiplied?", a: 27, hint: "Volume scales by k³.", sol: R`\(3^3 = 27\).` },
 { type: "num", q: R`A sphere has radius 3. Find its volume, to the nearest tenth.`, a: 113.1, hint: R`\(V = \frac43\pi r^3\).`, sol: R`\(\frac43\pi(27) = 36\pi \approx 113.1\).` }
]},
{ id: "g10", title: "Probability", teks: "G.13", sum: "Counting, permutations and combinations, geometric and conditional probability.",
body: R`### Counting
**Fundamental Counting Principle:** if one choice has \(m\) options and a second has \(n\), there are \(m \cdot n\) ways to make both.

- **Permutations** (order matters): \({}_nP_r = \frac{n!}{(n-r)!}\)
- **Combinations** (order does not matter): \({}_nC_r = \frac{n!}{r!(n-r)!}\)

### Probability
\(P(A) = \frac{\text{favorable outcomes}}{\text{total outcomes}}\), and \(P(\text{not } A) = 1 - P(A)\).

**Geometric probability** uses length or area: \(P = \frac{\text{favorable region}}{\text{whole region}}\).

### Combining events
- **Independent** events: \(P(A \text{ and } B) = P(A)\cdot P(B)\)
- **Dependent** events: \(P(A \text{ and } B) = P(A)\cdot P(B \mid A)\)
- **Conditional probability:** \(P(B \mid A) = \frac{P(A \text{ and } B)}{P(A)}\)
- **Or:** \(P(A \text{ or } B) = P(A) + P(B) - P(A \text{ and } B)\)

Two-way frequency tables are a common way to find conditional probabilities: restrict to the row or column for the given condition.`,
keys: ["Order matters → permutation; order doesn't → combination.", "Geometric probability = favorable area ÷ total area.", R`\(P(B\mid A) = \frac{P(A\text{ and }B)}{P(A)}\).`],
ex: { p: R`A dart lands at a random point on a square board with side 10 in. A circle of radius 3 in is painted inside it. What is the probability the dart lands in the circle?`,
  steps: [R`Circle area: \(\pi(3^2) = 9\pi\). Square area: \(10^2 = 100\).`, R`\(P = \frac{9\pi}{100} \approx 0.283\).`], ans: "About 0.283, or 28.3%" },
qs: [
 { type: "num", q: "How many ways can a committee of 2 be chosen from 5 people?", a: 10, hint: "Order doesn't matter, so use a combination.", sol: R`\({}_5C_2 = \frac{5!}{2!\,3!} = 10\).` },
 { type: "num", q: "In how many different orders can 4 books be arranged on a shelf?", a: 24, hint: R`\(4!\)`, sol: R`\(4! = 4 \cdot 3 \cdot 2 \cdot 1 = 24\).` },
 { type: "num", q: R`Events A and B are independent with \(P(A) = 0.5\) and \(P(B) = 0.4\). Find \(P(A \text{ and } B)\).`, a: 0.2, hint: "Multiply for independent events.", sol: R`\(0.5 \times 0.4 = 0.2\).` }
]}
],

alg1: [
{ id: "a1", title: "Linear Equations and Inequalities", teks: "A.5", sum: "Solving multi-step equations and inequalities, including special cases.",
body: R`To solve a linear equation, undo operations in reverse order while keeping both sides balanced:

1. Distribute and remove parentheses.
2. Combine like terms on each side.
3. Move the variable terms to one side.
4. Isolate the variable with inverse operations.
5. Check by substituting back in.

### Special cases
- If the variables cancel and you get a **false** statement (like \(3 = 7\)), there is **no solution**.
- If you get a **true** statement (like \(6 = 6\)), there are **infinitely many solutions**.

### Inequalities
Solve like an equation, with one key rule: **multiplying or dividing by a negative number reverses the inequality sign**. Graph on a number line with an open circle for \(<, >\) and a closed circle for \(\le, \ge\).

### Literal equations
Solve formulas for a named variable the same way. For example, \(A = \frac12 bh\) solved for \(h\) gives \(h = \frac{2A}{b}\).`,
keys: ["Distribute, combine, collect, isolate, check.", "False statement → no solution; true statement → infinitely many.", "Flip the inequality when multiplying or dividing by a negative."],
ex: { p: R`Solve \(3(x - 4) + 2 = 2x + 5\).`,
  steps: [R`Distribute: \(3x - 12 + 2 = 2x + 5\).`, R`Combine: \(3x - 10 = 2x + 5\).`, R`Subtract \(2x\), add 10: \(x = 15\).`, R`Check: \(3(11) + 2 = 35\) and \(2(15) + 5 = 35\). ✓`], ans: R`\(x = 15\)` },
qs: [
 { type: "num", q: R`Solve \(5x - 7 = 2x + 11\).`, a: 6, hint: R`Get \(x\)-terms on one side: \(3x = 18\).`, sol: R`\(5x - 2x = 11 + 7 \Rightarrow 3x = 18 \Rightarrow x = 6\).` },
 { type: "mc", q: R`Solve \(-2x + 3 > 11\).`, choices: [R`\(x > -4\)`, R`\(x < -4\)`, R`\(x > 4\)`, R`\(x < 7\)`], a: 1, hint: "Dividing by −2 flips the sign.", sol: R`\(-2x > 8\). Divide by \(-2\) and flip: \(x < -4\).` },
 { type: "mc", q: R`How many solutions does \(2(x + 3) = 2x + 6\) have?`, choices: ["None", "Exactly one", "Exactly two", "Infinitely many"], a: 3, hint: "Distribute the left side and compare.", sol: R`\(2x + 6 = 2x + 6\) is always true, so every real number is a solution.` }
]},
{ id: "a2", title: "Functions", teks: "A.12", sum: "What makes a relation a function, notation, domain and range, and arithmetic sequences.",
body: R`A **function** assigns **exactly one output** to each input. In a graph, the **vertical line test** checks this: if any vertical line hits the graph more than once, it is not a function.

### Notation
\(f(x)\) is read "f of x" and means the output when the input is \(x\). To evaluate \(f(3)\), replace every \(x\) with 3.

### Domain and range
- **Domain:** all allowed inputs (x-values)
- **Range:** all resulting outputs (y-values)

In context, the domain is often limited: you cannot buy \(-2\) tickets or \(2.5\) tickets.

### Arithmetic sequences
An arithmetic sequence adds the same **common difference** \(d\) each time:
$$a_n = a_1 + (n - 1)d$$
This is a linear function with the term number \(n\) as input. For example, 7, 11, 15, … has \(a_1 = 7\) and \(d = 4\), so \(a_n = 4n + 3\).`,
keys: ["Each input gets exactly one output.", R`\(f(a)\): substitute \(a\) for every \(x\).`, R`Arithmetic: \(a_n = a_1 + (n-1)d\).`],
ex: { p: R`If \(f(x) = x^2 - 3x\), find \(f(-2)\).`,
  steps: [R`Substitute: \(f(-2) = (-2)^2 - 3(-2)\).`, R`Simplify: \(4 + 6 = 10\).`], ans: R`\(f(-2) = 10\)` },
qs: [
 { type: "num", q: R`If \(f(x) = 3x - 5\), find \(f(4)\).`, a: 7, hint: "Replace x with 4.", sol: R`\(3(4) - 5 = 7\).` },
 { type: "mc", q: "Which relation is NOT a function?", choices: [R`\(\{(1,2),(2,4),(3,6)\}\)`, R`\(\{(1,2),(1,3),(2,4)\}\)`, R`\(\{(0,5),(1,5),(2,5)\}\)`, R`\(\{(-1,1),(0,0),(1,1)\}\)`], a: 1, hint: "Look for an input that appears twice with different outputs.", sol: "The input 1 is paired with both 2 and 3, so that relation is not a function." },
 { type: "num", q: "What is the 20th term of the arithmetic sequence 7, 11, 15, …?", a: 83, hint: R`\(a_{20} = 7 + 19d\).`, sol: R`\(d = 4\), so \(a_{20} = 7 + 19(4) = 83\).` }
]},
{ id: "a3", title: "Linear Functions and Slope", teks: "A.2, A.3", sum: "Slope as rate of change, the three forms of a line, intercepts, and parallel or perpendicular lines.",
body: R`**Slope** measures steepness, the rate of change of \(y\) with respect to \(x\):
$$m = \frac{y_2 - y_1}{x_2 - x_1} = \frac{\text{rise}}{\text{run}}$$
Positive slope rises left to right, negative slope falls, zero slope is horizontal, and a vertical line has undefined slope.

### Three forms
- **Slope-intercept:** \(y = mx + b\), where \(b\) is the y-intercept
- **Point-slope:** \(y - y_1 = m(x - x_1)\)
- **Standard:** \(Ax + By = C\), handy for intercepts: set \(y = 0\) to find the x-intercept and \(x = 0\) for the y-intercept

### Parallel and perpendicular
Parallel lines share the same slope. Perpendicular slopes are negative reciprocals.

### Transformations of \(f(x) = x\)
In \(y = mx + b\), changing \(m\) rotates the line (steeper when \(|m|\) is larger), and changing \(b\) shifts it up or down. In context, slope is the rate (dollars per hour) and the y-intercept is the starting value.`,
keys: [R`\(m = \frac{\Delta y}{\Delta x}\).`, R`\(y = mx + b\), \(y - y_1 = m(x - x_1)\), \(Ax + By = C\).`, "Intercepts: set the other variable to 0.", "Slope = rate; y-intercept = starting value."],
ex: { p: R`Write an equation of the line through \((2, 5)\) and \((6, 13)\) in slope-intercept form.`,
  steps: [R`Slope: \(m = \frac{13 - 5}{6 - 2} = \frac{8}{4} = 2\).`, R`Point-slope: \(y - 5 = 2(x - 2)\).`, R`Simplify: \(y = 2x + 1\).`], ans: R`\(y = 2x + 1\)` },
qs: [
 { type: "num", q: R`Find the slope of the line through \((-1, 4)\) and \((3, -8)\).`, a: -3, hint: "Change in y divided by change in x.", sol: R`\(\frac{-8 - 4}{3 - (-1)} = \frac{-12}{4} = -3\).` },
 { type: "num", q: R`What is the x-intercept of \(3x + 4y = 24\)?`, a: 8, hint: R`Set \(y = 0\).`, sol: R`\(3x = 24 \Rightarrow x = 8\).` },
 { type: "mc", q: R`Which line is parallel to \(y = -2x + 7\) and passes through \((1, 1)\)?`, choices: [R`\(y = -2x + 3\)`, R`\(y = 2x - 1\)`, R`\(y = \tfrac12 x + \tfrac12\)`, R`\(y = -2x + 1\)`], a: 0, hint: "Same slope, then solve for b.", sol: R`Slope \(-2\): \(1 = -2(1) + b \Rightarrow b = 3\). So \(y = -2x + 3\).` }
]},
{ id: "a4", title: "Systems of Equations", teks: "A.3, A.5", sum: "Solving by graphing, substitution and elimination; word problems; systems of inequalities.",
body: R`A **system** is two or more equations with the same variables. Its solution is the point that makes every equation true, the **intersection** of the graphs.

### Methods
- **Graphing:** read the intersection point.
- **Substitution:** solve one equation for a variable and substitute into the other. Best when a variable already has coefficient 1.
- **Elimination:** add or subtract equations (after multiplying if needed) so one variable cancels.

### Number of solutions
- Different slopes: **one** solution
- Same slope, different intercepts (parallel): **no** solution
- Same line: **infinitely many** solutions

### Word problems
Define two variables, write one equation for each fact (often a **count** equation and a **value** equation), and solve.

### Systems of inequalities
Graph each inequality (dashed line for \(<, >\), solid for \(\le, \ge\)) and shade. The solution is the region where the shadings overlap.`,
keys: ["Solution = intersection point.", "Substitution when a variable is isolated; elimination when coefficients line up.", "Parallel lines → no solution; same line → infinitely many."],
ex: { p: R`Solve \(x + y = 10\) and \(2x - y = 5\).`,
  steps: [R`Add the equations to eliminate \(y\): \(3x = 15\), so \(x = 5\).`, R`Substitute: \(5 + y = 10 \Rightarrow y = 5\).`, R`Check in the second equation: \(2(5) - 5 = 5\). ✓`], ans: R`\((5, 5)\)` },
qs: [
 { type: "num", q: R`Solve the system \(y = 2x + 1\) and \(3x + y = 16\). What is \(x\)?`, a: 3, hint: "Substitute 2x + 1 for y in the second equation.", sol: R`\(3x + 2x + 1 = 16 \Rightarrow 5x = 15 \Rightarrow x = 3\) (and \(y = 7\)).` },
 { type: "mc", q: R`How many solutions does the system \(y = 3x + 2\), \(y = 3x - 4\) have?`, choices: ["None", "One", "Two", "Infinitely many"], a: 0, hint: "Compare slopes and intercepts.", sol: "Same slope, different y-intercepts: the lines are parallel and never meet." },
 { type: "num", q: "Adult tickets cost $8 and student tickets cost $5. A group bought 30 tickets for $195. How many adult tickets did they buy?", a: 15, hint: R`\(a + s = 30\) and \(8a + 5s = 195\).`, sol: R`Substitute \(s = 30 - a\): \(8a + 150 - 5a = 195 \Rightarrow 3a = 45 \Rightarrow a = 15\).` }
]},
{ id: "a5", title: "Exponents and Polynomials", teks: "A.10, A.11", sum: "Exponent rules, radicals and rational exponents, and adding or multiplying polynomials.",
body: R`### Exponent rules
- \(a^m \cdot a^n = a^{m+n}\) and \(\frac{a^m}{a^n} = a^{m-n}\)
- \((a^m)^n = a^{mn}\) and \((ab)^n = a^n b^n\)
- \(a^0 = 1\) and \(a^{-n} = \frac{1}{a^n}\) (for \(a \ne 0\))

### Rational exponents and radicals
\(a^{1/n} = \sqrt[n]{a}\) and \(a^{m/n} = \left(\sqrt[n]{a}\right)^m\). Simplify radicals by pulling out perfect-square factors: \(\sqrt{72} = \sqrt{36 \cdot 2} = 6\sqrt{2}\).

### Polynomials
Add or subtract by combining like terms. Multiply by distributing every term: for two binomials, FOIL works. Watch the special products:
$$(a + b)^2 = a^2 + 2ab + b^2 \qquad (a - b)^2 = a^2 - 2ab + b^2 \qquad (a+b)(a-b) = a^2 - b^2$$
A common error is writing \((a+b)^2 = a^2 + b^2\). The middle term \(2ab\) is required.

Divide a polynomial by a monomial by dividing each term.`,
keys: ["Multiply → add exponents; power of a power → multiply.", R`\(a^{-n} = 1/a^n\); \(a^{m/n} = (\sqrt[n]{a})^m\).`, R`\((a+b)^2\) has a middle term \(2ab\).`],
ex: { p: R`Simplify \((2x^3y^{-2})^3\) and expand \((x + 5)(x - 3)\).`,
  steps: [R`Power rule on each factor: \(2^3 x^9 y^{-6} = \frac{8x^9}{y^6}\).`, R`FOIL: \(x^2 - 3x + 5x - 15 = x^2 + 2x - 15\).`], ans: R`\(\frac{8x^9}{y^6}\); \(x^2 + 2x - 15\)` },
qs: [
 { type: "mc", q: R`Simplify \((x^2)^3 \cdot x^4\).`, choices: [R`\(x^9\)`, R`\(x^{10}\)`, R`\(x^{24}\)`, R`\(x^{12}\)`], a: 1, hint: "Power of a power first, then add exponents.", sol: R`\((x^2)^3 = x^6\), then \(x^6 \cdot x^4 = x^{10}\).` },
 { type: "num", q: R`Evaluate \(16^{3/4}\).`, a: 8, hint: R`Take the 4th root first.`, sol: R`\(\sqrt[4]{16} = 2\), and \(2^3 = 8\).` },
 { type: "mc", q: R`Expand \((2x - 3)^2\).`, choices: [R`\(4x^2 + 9\)`, R`\(4x^2 - 9\)`, R`\(4x^2 - 12x + 9\)`, R`\(4x^2 - 6x + 9\)`], a: 2, hint: R`Use \((a-b)^2 = a^2 - 2ab + b^2\).`, sol: R`\((2x)^2 - 2(2x)(3) + 3^2 = 4x^2 - 12x + 9\).` }
]},
{ id: "a6", title: "Factoring", teks: "A.10", sum: "GCF, trinomials, the AC method, difference of squares, and perfect square trinomials.",
body: R`Factoring rewrites a polynomial as a product. **Always look for a GCF first.**

### Trinomials \(x^2 + bx + c\)
Find two numbers that **multiply to \(c\)** and **add to \(b\)**. For \(x^2 + 7x + 12\): 3 and 4, so \((x+3)(x+4)\).

### Trinomials \(ax^2 + bx + c\) (AC method)
1. Multiply \(a \cdot c\).
2. Find two numbers that multiply to \(ac\) and add to \(b\).
3. Split the middle term with them and **factor by grouping**.

### Special patterns
- **Difference of squares:** \(a^2 - b^2 = (a + b)(a - b)\)
- **Perfect square trinomial:** \(a^2 \pm 2ab + b^2 = (a \pm b)^2\)

A sum of squares like \(x^2 + 9\) does not factor over the real numbers.

Check any factorization by multiplying it back out.`,
keys: ["GCF first, every time.", R`\(x^2+bx+c\): multiply to \(c\), add to \(b\).`, R`\(a^2 - b^2 = (a+b)(a-b)\).`, "Check by multiplying back."],
ex: { p: R`Factor \(6x^2 + 7x - 3\).`,
  steps: [R`\(ac = 6(-3) = -18\). Numbers that multiply to \(-18\) and add to 7: 9 and \(-2\).`, R`Split: \(6x^2 + 9x - 2x - 3\).`, R`Group: \(3x(2x + 3) - 1(2x + 3) = (3x - 1)(2x + 3)\).`], ans: R`\((3x - 1)(2x + 3)\)` },
qs: [
 { type: "mc", q: R`Factor \(x^2 - 5x - 14\).`, choices: [R`\((x - 7)(x + 2)\)`, R`\((x + 7)(x - 2)\)`, R`\((x - 7)(x - 2)\)`, R`\((x - 14)(x + 1)\)`], a: 0, hint: "Multiply to −14 and add to −5.", sol: R`\(-7 \cdot 2 = -14\) and \(-7 + 2 = -5\), so \((x-7)(x+2)\).` },
 { type: "mc", q: R`Factor \(4x^2 - 25\).`, choices: [R`\((2x - 5)^2\)`, R`\((2x - 5)(2x + 5)\)`, R`\((4x - 5)(x + 5)\)`, "It does not factor"], a: 1, hint: "Difference of squares.", sol: R`\((2x)^2 - 5^2 = (2x - 5)(2x + 5)\).` },
 { type: "mc", q: R`Factor completely: \(3x^2 + 12x\).`, choices: [R`\(3(x^2 + 4x)\)`, R`\(x(3x + 12)\)`, R`\(3x(x + 4)\)`, R`\(3x(x + 12)\)`], a: 2, hint: "Find the greatest common factor of both terms.", sol: R`The GCF is \(3x\): \(3x(x + 4)\).` }
]},
{ id: "a7", title: "Quadratic Functions", teks: "A.6, A.7", sum: "Forms of a quadratic, the vertex and axis of symmetry, zeros, and transformations.",
body: R`A quadratic function has degree 2 and graphs as a **parabola**.

### Three forms
- **Standard:** \(f(x) = ax^2 + bx + c\). The y-intercept is \(c\).
- **Vertex:** \(f(x) = a(x - h)^2 + k\). The vertex is \((h, k)\).
- **Factored:** \(f(x) = a(x - p)(x - q)\). The zeros are \(p\) and \(q\).

### Key features
- If \(a > 0\) the parabola opens up and the vertex is a **minimum**; if \(a < 0\) it opens down and the vertex is a **maximum**.
- **Axis of symmetry:** \(x = -\frac{b}{2a}\). Substitute this x-value to get the vertex's y-value.
- **Zeros** (roots, x-intercepts) are where \(f(x) = 0\).
- The domain is all real numbers. The range is \(y \ge k\) (opens up) or \(y \le k\) (opens down).

### Transformations of \(f(x) = x^2\)
In \(a(x - h)^2 + k\): \(h\) shifts right, \(k\) shifts up, \(|a| > 1\) stretches vertically (narrower), \(0 < |a| < 1\) compresses (wider), and a negative \(a\) reflects over the x-axis.`,
keys: [R`Vertex form \(a(x-h)^2+k\) shows the vertex \((h,k)\).`, R`Axis: \(x = -\frac{b}{2a}\).`, "a > 0 opens up (minimum); a < 0 opens down (maximum)."],
ex: { p: R`Find the vertex, the axis of symmetry and the range of \(f(x) = 2x^2 - 8x + 3\).`,
  steps: [R`Axis: \(x = -\frac{-8}{2(2)} = 2\).`, R`Vertex y-value: \(f(2) = 2(4) - 16 + 3 = -5\). Vertex \((2, -5)\).`, R`\(a = 2 > 0\), so it opens up: range \(y \ge -5\).`], ans: R`Vertex \((2,-5)\), axis \(x = 2\), range \(y \ge -5\)` },
qs: [
 { type: "num", q: R`What is the x-coordinate of the vertex of \(y = x^2 + 6x + 1\)?`, a: -3, hint: R`\(x = -\frac{b}{2a}\).`, sol: R`\(x = -\frac{6}{2(1)} = -3\).` },
 { type: "mc", q: R`Which describes \(y = -(x - 4)^2 + 7\)?`, choices: ["Minimum of 7 at x = 4", "Maximum of 7 at x = 4", "Maximum of 4 at x = 7", "Minimum of −4 at x = 7"], a: 1, hint: R`Read the vertex \((h,k)\) and the sign of \(a\).`, sol: R`Vertex \((4, 7)\) and \(a = -1 < 0\), so the parabola opens down with a maximum of 7 at \(x = 4\).` },
 { type: "num", q: R`What is the positive zero of \(y = (x - 3)(x + 5)\)?`, a: 3, hint: "Set each factor equal to zero.", sol: R`\(x - 3 = 0 \Rightarrow x = 3\) and \(x + 5 = 0 \Rightarrow x = -5\). The positive zero is 3.` }
]},
{ id: "a8", title: "Solving Quadratic Equations", teks: "A.8", sum: "Factoring, square roots, completing the square, the quadratic formula, and the discriminant.",
body: R`Write the equation as \(ax^2 + bx + c = 0\), then pick a method.

### Factoring
Use the **zero product property**: if \(AB = 0\), then \(A = 0\) or \(B = 0\).

### Square roots
For \((x - h)^2 = k\), take the square root of both sides, remembering \(\pm\): \(x = h \pm \sqrt{k}\).

### Completing the square
For \(x^2 + bx = c\), add \(\left(\frac{b}{2}\right)^2\) to both sides, then write the left side as a perfect square.

### Quadratic formula
Works for every quadratic:
$$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

### The discriminant \(b^2 - 4ac\)
- Positive: two real solutions
- Zero: one real solution (a double root)
- Negative: no real solutions (the parabola misses the x-axis)`,
keys: ["Set equal to zero first.", R`\(x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}\).`, R`Discriminant \(>0\): 2, \(=0\): 1, \(<0\): 0 real solutions.`, R`Don't forget \(\pm\) with square roots.`],
ex: { p: R`Solve \(2x^2 + 3x - 5 = 0\).`,
  steps: [R`\(a = 2, b = 3, c = -5\). Discriminant: \(9 - 4(2)(-5) = 49\).`, R`\(x = \frac{-3 \pm 7}{4}\).`, R`\(x = \frac{4}{4} = 1\) or \(x = \frac{-10}{4} = -\frac{5}{2}\).`], ans: R`\(x = 1\) or \(x = -\frac52\)` },
qs: [
 { type: "num", q: R`Solve \(x^2 - 9x + 20 = 0\). What is the larger solution?`, a: 5, hint: "Factor: multiply to 20, add to −9.", sol: R`\((x - 4)(x - 5) = 0\), so \(x = 4\) or \(x = 5\). The larger is 5.` },
 { type: "mc", q: R`How many real solutions does \(x^2 + 4x + 5 = 0\) have?`, choices: ["0", "1", "2", "Infinitely many"], a: 0, hint: "Compute the discriminant.", sol: R`\(b^2 - 4ac = 16 - 20 = -4 < 0\), so there are no real solutions.` },
 { type: "num", q: R`Solve \((x - 2)^2 = 49\). What is the positive solution?`, a: 9, hint: R`\(x - 2 = \pm 7\).`, sol: R`\(x = 2 + 7 = 9\) or \(x = 2 - 7 = -5\).` }
]},
{ id: "a9", title: "Exponential Functions", teks: "A.9", sum: "Growth and decay, percent rates, compound interest, and geometric sequences.",
body: R`An exponential function has the form \(f(x) = a \cdot b^x\), where \(a\) is the starting value and \(b\) is the **growth factor**.
- \(b > 1\): exponential **growth**
- \(0 < b < 1\): exponential **decay**

### Percent rates
With rate \(r\) as a decimal:
- Growth: \(y = a(1 + r)^t\)
- Decay: \(y = a(1 - r)^t\)

A factor of \(0.8\) means a 20% decrease; \(1.05\) means a 5% increase.

### Compound interest
$$A = P\left(1 + \frac{r}{n}\right)^{nt}$$
where \(n\) is the number of compounding periods per year.

### Linear versus exponential
Linear functions change by a **constant difference**; exponential functions change by a **constant ratio**. Exponential growth always overtakes linear growth eventually.

### Geometric sequences
Multiply by a common ratio \(r\) each time: \(a_n = a_1 \cdot r^{n-1}\).`,
keys: ["b > 1 growth; 0 < b < 1 decay.", R`Growth \(a(1+r)^t\), decay \(a(1-r)^t\).`, "Constant ratio → exponential; constant difference → linear.", R`\(a_n = a_1 r^{n-1}\).`],
ex: { p: R`$500 is invested at 4% interest compounded yearly. How much is in the account after 10 years?`,
  steps: [R`\(A = 500(1.04)^{10}\).`, R`\(1.04^{10} \approx 1.4802\).`, R`\(A \approx 500(1.4802) \approx \$740.12\).`], ans: "About $740.12" },
qs: [
 { type: "num", q: "A $20,000 car loses 15% of its value each year. What is it worth after 2 years, in dollars?", a: 14450, hint: R`\(20000(0.85)^2\).`, sol: R`\(20000(0.85)^2 = 20000(0.7225) = 14450\).` },
 { type: "mc", q: R`What does \(y = 3(0.8)^x\) model?`, choices: ["Growth of 80%", "Decay of 80%", "Decay of 20%", "Growth of 20%"], a: 2, hint: R`\(0.8 = 1 - r\).`, sol: R`\(1 - r = 0.8\) gives \(r = 0.2\): a 20% decay per period.` },
 { type: "num", q: "Find the 8th term of the geometric sequence 3, 6, 12, …", a: 384, hint: R`\(a_8 = 3 \cdot 2^7\).`, sol: R`\(r = 2\), so \(a_8 = 3 \cdot 2^7 = 3 \cdot 128 = 384\).` }
]}
],

alg2: [
{ id: "b1", title: "Functions, Transformations and Inverses", teks: "2A.2, 2A.4, 2A.6", sum: "Parent functions, the transformation form, composition, and inverse functions.",
body: R`### Parent functions
Linear \(x\), quadratic \(x^2\), cubic \(x^3\), square root \(\sqrt{x}\), cube root \(\sqrt[3]{x}\), absolute value \(|x|\), reciprocal \(\frac{1}{x}\), exponential \(b^x\) and logarithmic \(\log_b x\).

### Transformations
$$g(x) = a\,f\big(b(x - h)\big) + k$$
- \(h\): horizontal shift (right if positive), \(k\): vertical shift (up if positive)
- \(a\): vertical stretch or compression; negative \(a\) reflects over the x-axis
- \(b\): horizontal compression by \(\frac{1}{|b|}\); negative \(b\) reflects over the y-axis

### Composition
\((f \circ g)(x) = f(g(x))\): evaluate the inside function first.

### Inverse functions
An inverse undoes a function. To find \(f^{-1}\): write \(y = f(x)\), **swap** \(x\) and \(y\), and solve for \(y\). The graphs of \(f\) and \(f^{-1}\) are reflections over \(y = x\), and \(f(f^{-1}(x)) = x\). The domain of \(f\) is the range of \(f^{-1}\). A function needs to be one-to-one to have an inverse function, so sometimes the domain is restricted (for example \(x \ge 0\) for \(f(x) = x^2\)).`,
keys: [R`\(a f(b(x-h)) + k\): h right, k up, a stretch/reflect.`, "Composition: inside first.", "Inverse: swap x and y, solve for y.", "f and f⁻¹ reflect over y = x."],
ex: { p: R`Find the inverse of \(f(x) = 3x - 6\) and verify it.`,
  steps: [R`\(y = 3x - 6\). Swap: \(x = 3y - 6\).`, R`Solve: \(y = \frac{x + 6}{3}\), so \(f^{-1}(x) = \frac{x+6}{3}\).`, R`Check: \(f(f^{-1}(x)) = 3\cdot\frac{x+6}{3} - 6 = x\). ✓`], ans: R`\(f^{-1}(x) = \frac{x+6}{3}\)` },
qs: [
 { type: "num", q: R`If \(f(x) = 2x + 1\) and \(g(x) = x^2\), find \(f(g(3))\).`, a: 19, hint: R`\(g(3)\) first.`, sol: R`\(g(3) = 9\), then \(f(9) = 19\).` },
 { type: "mc", q: R`What is the inverse of \(f(x) = \frac{x - 4}{2}\)?`, choices: [R`\(f^{-1}(x) = 2x - 4\)`, R`\(f^{-1}(x) = 2x + 4\)`, R`\(f^{-1}(x) = \frac{x + 4}{2}\)`, R`\(f^{-1}(x) = \frac{2}{x - 4}\)`], a: 1, hint: "Swap x and y, then multiply by 2.", sol: R`\(x = \frac{y - 4}{2} \Rightarrow 2x = y - 4 \Rightarrow y = 2x + 4\).` },
 { type: "mc", q: R`How is \(y = |x + 3| - 2\) related to \(y = |x|\)?`, choices: ["Right 3, down 2", "Left 3, down 2", "Left 3, up 2", "Right 2, up 3"], a: 1, hint: R`\(x + 3 = x - (-3)\).`, sol: R`\(h = -3\) (left 3) and \(k = -2\) (down 2).` }
]},
{ id: "b2", title: "Systems", teks: "2A.3", sum: "Three-variable linear systems and linear-quadratic systems.",
body: R`### Three variables
A system of three linear equations in \(x, y, z\) is solved by reducing it to two variables:
1. Use one pair of equations to eliminate a variable.
2. Use a different pair to eliminate the **same** variable.
3. Solve the resulting two-variable system.
4. Back-substitute to find the third variable.

Each equation is a plane; the solution is where all three meet. There may be one solution, none, or infinitely many.

### Linear-quadratic systems
To solve a line and a parabola together, substitute the linear expression into the quadratic and solve the resulting quadratic equation. A line can meet a parabola **0, 1 or 2** times, matching the discriminant of that equation.

### Systems of inequalities
Graph each boundary (dashed for strict, solid otherwise), shade the correct side, and the solution is the overlapping region. Linear programming finds the maximum or minimum of an expression at a **vertex** of that region.`,
keys: ["Eliminate the same variable twice to get a 2×2 system.", "Line and parabola: 0, 1 or 2 intersections.", "Optimization happens at a vertex of the feasible region."],
ex: { p: R`Solve the system \(y = x^2 - 1\) and \(y = x + 1\).`,
  steps: [R`Set equal: \(x^2 - 1 = x + 1\).`, R`\(x^2 - x - 2 = 0 \Rightarrow (x - 2)(x + 1) = 0\).`, R`\(x = 2 \Rightarrow y = 3\); \(x = -1 \Rightarrow y = 0\).`], ans: R`\((2, 3)\) and \((-1, 0)\)` },
qs: [
 { type: "num", q: R`Solve: \(x + y + z = 6\), \(y + z = 5\), \(z = 3\). What is \(x\)?`, a: 1, hint: "Back-substitute from the bottom.", sol: R`\(z = 3\), so \(y = 2\), so \(x = 6 - 2 - 3 = 1\).` },
 { type: "mc", q: R`How many times does the line \(y = -3\) intersect the parabola \(y = x^2\)?`, choices: ["0", "1", "2", "3"], a: 0, hint: R`Can \(x^2\) equal \(-3\)?`, sol: R`\(x^2 = -3\) has no real solutions; the parabola is never below the x-axis.` },
 { type: "num", q: R`If \(x + y = 7\) and \(x - y = 1\), what is \(xy\)?`, a: 12, hint: "Add the equations to find x.", sol: R`\(2x = 8 \Rightarrow x = 4\), \(y = 3\), so \(xy = 12\).` }
]},
{ id: "b3", title: "Quadratics and Complex Numbers", teks: "2A.4, 2A.7", sum: "The imaginary unit, complex arithmetic, and complex solutions of quadratics.",
body: R`### The imaginary unit
\(i = \sqrt{-1}\), so \(i^2 = -1\). Powers of \(i\) repeat every four: \(i, -1, -i, 1\). To simplify \(i^n\), divide \(n\) by 4 and use the remainder.

For \(k > 0\): \(\sqrt{-k} = i\sqrt{k}\).

### Complex numbers \(a + bi\)
- Add and subtract by combining real parts and imaginary parts.
- Multiply like binomials, then replace \(i^2\) with \(-1\).
- The **conjugate** of \(a + bi\) is \(a - bi\), and \((a + bi)(a - bi) = a^2 + b^2\), a real number. Use it to divide.

### Complex solutions
When the discriminant is negative, the quadratic formula gives two **complex conjugate** solutions.

### Writing a quadratic from its roots
If the roots are \(p\) and \(q\), then \(f(x) = a(x - p)(x - q)\). Complex roots always come in conjugate pairs for polynomials with real coefficients.

### Vertex form by completing the square
Rewrite \(ax^2 + bx + c\) as \(a(x - h)^2 + k\) to read off the vertex.`,
keys: [R`\(i^2 = -1\); powers cycle every 4.`, "Multiply complex numbers like binomials.", R`\((a+bi)(a-bi) = a^2 + b^2\).`, "Negative discriminant → conjugate complex roots."],
ex: { p: R`Solve \(x^2 - 4x + 13 = 0\).`,
  steps: [R`Discriminant: \(16 - 52 = -36\).`, R`\(x = \frac{4 \pm \sqrt{-36}}{2} = \frac{4 \pm 6i}{2}\).`, R`\(x = 2 \pm 3i\).`], ans: R`\(x = 2 + 3i\) or \(x = 2 - 3i\)` },
qs: [
 { type: "mc", q: R`Simplify \((3 + 2i)(1 - i)\).`, choices: [R`\(5 - i\)`, R`\(1 - i\)`, R`\(3 - 2i\)`, R`\(5 + i\)`], a: 0, hint: R`FOIL, then \(i^2 = -1\).`, sol: R`\(3 - 3i + 2i - 2i^2 = 3 - i + 2 = 5 - i\).` },
 { type: "mc", q: R`Simplify \(i^{23}\).`, choices: [R`\(1\)`, R`\(i\)`, R`\(-1\)`, R`\(-i\)`], a: 3, hint: "23 ÷ 4 leaves remainder 3.", sol: R`\(i^{23} = i^{20} \cdot i^3 = 1 \cdot (-i) = -i\).` },
 { type: "mc", q: R`What are the solutions of \(x^2 + 9 = 0\)?`, choices: [R`\(\pm 3\)`, R`\(\pm 3i\)`, R`\(\pm 9i\)`, R`\(3i\) only`], a: 1, hint: R`\(x^2 = -9\).`, sol: R`\(x = \pm\sqrt{-9} = \pm 3i\).` }
]},
{ id: "b4", title: "Polynomial Functions", teks: "2A.7", sum: "End behavior, zeros and multiplicity, division, and the Remainder and Factor theorems.",
body: R`### End behavior
Determined by the **leading term** \(a x^n\):
- Even degree: both ends point the same way (up if \(a > 0\), down if \(a < 0\)).
- Odd degree: ends point opposite ways (down-left, up-right if \(a > 0\)).

### Zeros and multiplicity
If \((x - r)^m\) is a factor, \(r\) is a zero with multiplicity \(m\). Odd multiplicity: the graph **crosses** the x-axis. Even multiplicity: it **touches** and turns. A degree-\(n\) polynomial has exactly \(n\) complex zeros, counting multiplicity.

### Division
Use long division or **synthetic division** (for divisors \(x - c\)).

### Key theorems
- **Remainder Theorem:** dividing \(P(x)\) by \(x - c\) leaves remainder \(P(c)\).
- **Factor Theorem:** \(x - c\) is a factor exactly when \(P(c) = 0\).
- **Rational Root Theorem:** possible rational zeros are \(\pm\frac{\text{factors of the constant}}{\text{factors of the leading coefficient}}\).

### Special factoring
$$a^3 + b^3 = (a + b)(a^2 - ab + b^2) \qquad a^3 - b^3 = (a - b)(a^2 + ab + b^2)$$`,
keys: ["Leading term decides end behavior.", "Odd multiplicity crosses; even touches.", R`Remainder of \(P(x) \div (x-c)\) is \(P(c)\).`, R`\(a^3 - b^3 = (a-b)(a^2+ab+b^2)\).`],
ex: { p: R`Find all zeros of \(P(x) = x^3 - 6x^2 + 11x - 6\).`,
  steps: [R`Test \(x = 1\): \(1 - 6 + 11 - 6 = 0\), so \(x - 1\) is a factor.`, R`Divide: \(P(x) = (x - 1)(x^2 - 5x + 6)\).`, R`Factor: \((x - 1)(x - 2)(x - 3)\). Zeros: 1, 2, 3.`], ans: "1, 2 and 3" },
qs: [
 { type: "num", q: R`What is the remainder when \(x^3 + 2x - 5\) is divided by \(x - 2\)?`, a: 7, hint: "Remainder Theorem: evaluate P(2).", sol: R`\(P(2) = 8 + 4 - 5 = 7\).` },
 { type: "mc", q: R`Describe the end behavior of \(f(x) = -2x^4 + 3x - 1\).`, choices: ["Both ends up", "Both ends down", "Down left, up right", "Up left, down right"], a: 1, hint: "Even degree, negative leading coefficient.", sol: "Degree 4 is even, so both ends point the same way, and the negative leading coefficient points them down." },
 { type: "mc", q: R`Factor \(x^3 - 8\).`, choices: [R`\((x - 2)^3\)`, R`\((x - 2)(x^2 + 2x + 4)\)`, R`\((x - 2)(x^2 - 2x + 4)\)`, R`\((x + 2)(x^2 - 2x + 4)\)`], a: 1, hint: "Difference of cubes with a = x, b = 2.", sol: R`\(a^3 - b^3 = (a - b)(a^2 + ab + b^2)\) gives \((x - 2)(x^2 + 2x + 4)\).` }
]},
{ id: "b5", title: "Radical Functions and Equations", teks: "2A.4, 2A.6, 2A.7", sum: "Square root and cube root functions, rational exponents, and extraneous solutions.",
body: R`### Radical functions
- \(f(x) = \sqrt{x}\): domain \(x \ge 0\), range \(y \ge 0\)
- \(f(x) = \sqrt[3]{x}\): domain and range are all real numbers

For \(f(x) = a\sqrt{x - h} + k\), the starting point is \((h, k)\), the domain is \(x \ge h\), and the range is \(y \ge k\) when \(a > 0\).

### Rational exponents
\(x^{m/n} = \sqrt[n]{x^m} = (\sqrt[n]{x})^m\). Use exponent rules to simplify, for example \(x^{1/2}\cdot x^{1/3} = x^{5/6}\).

### Solving radical equations
1. Isolate the radical.
2. Raise both sides to the index power (square for square roots).
3. Solve the resulting equation.
4. **Check every answer in the original equation.** Squaring can create **extraneous** solutions that do not work.

Square roots and squaring are inverse operations on the restricted domain \(x \ge 0\).`,
keys: [R`\(\sqrt{x - h}\): domain \(x \ge h\).`, R`\(x^{m/n} = (\sqrt[n]{x})^m\).`, "Isolate, raise to the power, solve, check.", "Squaring can introduce extraneous solutions."],
ex: { p: R`Solve \(\sqrt{x + 7} = x + 1\).`,
  steps: [R`Square: \(x + 7 = x^2 + 2x + 1\).`, R`\(x^2 + x - 6 = 0 \Rightarrow (x + 3)(x - 2) = 0\), so \(x = -3\) or \(x = 2\).`, R`Check \(x = 2\): \(\sqrt{9} = 3\) ✓. Check \(x = -3\): \(\sqrt{4} = 2\) but \(-3 + 1 = -2\) ✗ (extraneous).`], ans: R`\(x = 2\)` },
qs: [
 { type: "num", q: R`Solve \(\sqrt{2x + 3} = 5\).`, a: 11, hint: "Square both sides.", sol: R`\(2x + 3 = 25 \Rightarrow x = 11\). Check: \(\sqrt{25} = 5\) ✓.` },
 { type: "num", q: R`Evaluate \(27^{2/3}\).`, a: 9, hint: "Cube root first.", sol: R`\(\sqrt[3]{27} = 3\), then \(3^2 = 9\).` },
 { type: "mc", q: R`What is the domain of \(y = \sqrt{x - 4} + 1\)?`, choices: [R`\(x \ge 1\)`, R`\(x \ge 4\)`, R`\(x \ge -4\)`, "All real numbers"], a: 1, hint: "The expression under the root must be nonnegative.", sol: R`\(x - 4 \ge 0 \Rightarrow x \ge 4\).` }
]},
{ id: "b6", title: "Rational Functions", teks: "2A.6, 2A.7", sum: "Asymptotes and holes, operations with rational expressions, and rational equations.",
body: R`A rational function is a ratio of polynomials, \(f(x) = \frac{p(x)}{q(x)}\). Always **factor first**.

### Holes and vertical asymptotes
- A factor that cancels from top and bottom gives a **hole**.
- A zero of the denominator that remains after canceling gives a **vertical asymptote**.

### Horizontal asymptotes
Compare the degrees of numerator \(n\) and denominator \(d\):
- \(n < d\): \(y = 0\)
- \(n = d\): \(y = \frac{\text{leading coefficient of top}}{\text{leading coefficient of bottom}}\)
- \(n > d\): no horizontal asymptote

### Operations
Multiply and divide by factoring and canceling. Add and subtract using a **common denominator** (the LCD).

### Rational equations
Multiply every term by the LCD to clear fractions, solve, and **check for extraneous solutions** that make a denominator zero.

### Inverse variation
\(y = \frac{k}{x}\), so \(xy = k\) stays constant.`,
keys: ["Factor first.", "Canceled factor → hole; remaining zero of denominator → vertical asymptote.", "Horizontal asymptote by comparing degrees.", "Check rational-equation answers against the denominators."],
ex: { p: R`Find the hole and asymptotes of \(f(x) = \frac{x^2 - 4}{x^2 - x - 2}\).`,
  steps: [R`Factor: \(\frac{(x - 2)(x + 2)}{(x - 2)(x + 1)}\).`, R`\(x - 2\) cancels: hole at \(x = 2\). Remaining \(x + 1\): vertical asymptote \(x = -1\).`, R`Equal degrees with leading coefficients 1 and 1: horizontal asymptote \(y = 1\).`], ans: R`Hole at \(x=2\); VA \(x=-1\); HA \(y=1\)` },
qs: [
 { type: "num", q: R`Where is the vertical asymptote of \(f(x) = \frac{3}{x - 5}\)? Give the x-value.`, a: 5, hint: "Where is the denominator zero?", sol: R`\(x - 5 = 0 \Rightarrow x = 5\).` },
 { type: "num", q: R`What is the horizontal asymptote of \(f(x) = \frac{6x^2 + 1}{2x^2 - 3}\)? Give the y-value.`, a: 3, hint: "Degrees are equal, so divide leading coefficients.", sol: R`\(y = \frac{6}{2} = 3\).` },
 { type: "num", q: R`\(y\) varies inversely with \(x\), and \(y = 8\) when \(x = 3\). Find \(y\) when \(x = 6\).`, a: 4, hint: R`\(k = xy\).`, sol: R`\(k = 24\), so \(y = \frac{24}{6} = 4\).` }
]},
{ id: "b7", title: "Exponential and Logarithmic Functions", teks: "2A.5", sum: "Logarithms as inverses, log properties, change of base, and solving exponential equations.",
body: R`### Definition
\(\log_b x = y\) means \(b^y = x\). A logarithm answers "what exponent?" The common log is \(\log x = \log_{10} x\) and the natural log is \(\ln x = \log_e x\), where \(e \approx 2.718\).

\(y = b^x\) and \(y = \log_b x\) are inverses: reflections over \(y = x\). The exponential has a horizontal asymptote \(y = 0\); the log has a vertical asymptote \(x = 0\) and domain \(x > 0\).

### Properties
- Product: \(\log_b(MN) = \log_b M + \log_b N\)
- Quotient: \(\log_b\frac{M}{N} = \log_b M - \log_b N\)
- Power: \(\log_b M^p = p\log_b M\)
- Change of base: \(\log_b x = \frac{\ln x}{\ln b}\)

### Solving equations
- Same base: set the exponents equal (\(2^x = 2^5 \Rightarrow x = 5\)).
- Otherwise, isolate the power and take a log of both sides.
- For log equations, rewrite in exponential form and check that no answer makes an argument \(\le 0\).

### Models
Continuous growth: \(A = Pe^{rt}\). Compound interest: \(A = P(1 + \frac{r}{n})^{nt}\).`,
keys: [R`\(\log_b x = y \iff b^y = x\).`, "Product → add, quotient → subtract, power → multiply.", R`\(\log_b x = \frac{\ln x}{\ln b}\).`, "Log arguments must be positive."],
ex: { p: R`Solve \(5^x = 20\) to the nearest thousandth.`,
  steps: [R`Take ln of both sides: \(x \ln 5 = \ln 20\).`, R`\(x = \frac{\ln 20}{\ln 5} \approx \frac{2.9957}{1.6094}\).`, R`\(x \approx 1.861\).`], ans: R`\(x \approx 1.861\)` },
qs: [
 { type: "num", q: R`Evaluate \(\log_2 32\).`, a: 5, hint: R`2 to what power is 32?`, sol: R`\(2^5 = 32\), so \(\log_2 32 = 5\).` },
 { type: "num", q: R`Solve \(3 \cdot 2^x = 48\).`, a: 4, hint: "Divide by 3 first.", sol: R`\(2^x = 16 = 2^4\), so \(x = 4\).` },
 { type: "num", q: R`Solve \(e^{2x} = 10\) to the nearest thousandth.`, a: 1.151, hint: "Take the natural log of both sides.", sol: R`\(2x = \ln 10 \approx 2.3026\), so \(x \approx 1.151\).` }
]},
{ id: "b8", title: "Absolute Value Functions and Equations", teks: "2A.6", sum: "Graphs of absolute value functions, and solving absolute value equations and inequalities.",
body: R`\(|x|\) is the **distance** from \(x\) to 0, so it is never negative.

### Graphs
\(f(x) = a|x - h| + k\) is a V shape with vertex \((h, k)\). It opens up when \(a > 0\) and down when \(a < 0\), and \(|a|\) controls the steepness of each side.

### Equations
To solve \(|A| = c\):
- If \(c > 0\): solve \(A = c\) **and** \(A = -c\).
- If \(c = 0\): solve \(A = 0\).
- If \(c < 0\): **no solution**.

Isolate the absolute value first, and check answers when variables appear on both sides.

### Inequalities
- \(|A| < c\) becomes the **"and"** compound \(-c < A < c\) (a segment between two points).
- \(|A| > c\) becomes the **"or"** compound \(A < -c\) or \(A > c\) (two rays going outward).

A quick memory aid: "less thAND, greatOR."`,
keys: [R`\(a|x-h|+k\): V with vertex \((h,k)\).`, R`\(|A| = c\): two cases; \(c < 0\) → no solution.`, R`\(|A| < c\) → and; \(|A| > c\) → or.`],
ex: { p: R`Solve \(|2x - 3| = 7\).`,
  steps: [R`Case 1: \(2x - 3 = 7 \Rightarrow x = 5\).`, R`Case 2: \(2x - 3 = -7 \Rightarrow x = -2\).`], ans: R`\(x = 5\) or \(x = -2\)` },
qs: [
 { type: "num", q: R`Solve \(|x + 4| = 10\). What is the positive solution?`, a: 6, hint: R`\(x + 4 = 10\) or \(x + 4 = -10\).`, sol: R`\(x = 6\) or \(x = -14\). The positive solution is 6.` },
 { type: "mc", q: R`Solve \(|x - 2| < 5\).`, choices: [R`\(-3 < x < 7\)`, R`\(x < -3\) or \(x > 7\)`, R`\(-7 < x < 3\)`, R`\(x < 7\)`], a: 0, hint: "Less than → 'and' compound.", sol: R`\(-5 < x - 2 < 5 \Rightarrow -3 < x < 7\).` },
 { type: "mc", q: R`How many solutions does \(|3x| = -6\) have?`, choices: ["None", "One", "Two", "Infinitely many"], a: 0, hint: "Can an absolute value be negative?", sol: "An absolute value is never negative, so there is no solution." }
]}
]
};
